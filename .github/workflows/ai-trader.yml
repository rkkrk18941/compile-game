name: AIトレーダー（デモ）

# 平日の大引け後に、株価の取得 → 注文の約定 → 逆指値チェック → 次の注文 を行い、
# 結果（games/ai-trader/data/）をコミットしてサイトに反映する。
on:
  schedule:
    - cron: "17 8 * * 1-5"   # 月〜金 17:17（日本時間）
  workflow_dispatch:
    inputs:
      force_search:
        description: "戦略探しを今すぐやり直す"
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - "games/ai-trader/bot/**"
      - "games/ai-trader/config.json"
      - ".github/workflows/ai-trader.yml"

permissions:
  contents: write

concurrency:
  group: ai-trader
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: games/ai-trader
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: games/ai-trader/requirements.txt
      - run: pip install -r requirements.txt
      - name: Run the bot
        run: python -m bot.run ${{ inputs.force_search && '--force-search' || '' }}
      - name: Save results
        run: |
          git config user.name "ai-trader-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -m "ai-trader: $(TZ=Asia/Tokyo date '+%Y-%m-%d %H:%M') の実行結果"
          for i in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep 5
          done
          exit 1
