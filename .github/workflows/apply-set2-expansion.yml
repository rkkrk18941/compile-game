name: Apply set 2 expansion

on:
  pull_request:
    branches:
      - agent/add-set2-card-pool
    paths:
      - .github/set2-apply-trigger

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/add-set2-card-pool
          fetch-depth: 0

      - name: Apply expansion patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path=Path('tools/set2-expansion.patch')
          text=path.read_text(encoding='utf-8')
          bad="   if(!Array.isArray(raw.arrangedReady)||raw.arrangedReady.length!==2||raw.arrangedReady.some(value=>typeof value!=='boolean')return null;"
          good="   if(!Array.isArray(raw.arrangedReady)||raw.arrangedReady.length!==2||raw.arrangedReady.some(value=>typeof value!=='boolean'))return null;"
          if text.count(bad)!=1:
              raise SystemExit(f'expected one patch correction target, found {text.count(bad)}')
          path.write_text(text.replace(bad,good),encoding='utf-8')
          PY
          git apply --check tools/set2-expansion.patch
          git apply tools/set2-expansion.patch

      - name: Validate JavaScript and rules
        shell: bash
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const html=fs.readFileSync('index.html','utf8');
          const scripts=[...html.matchAll(/<script(?: [^>]*)?>([\s\S]*?)<\/script>/g)].map(match=>match[1]);
          let failed=0;
          scripts.forEach((source,index)=>{try{new Function(source)}catch(error){console.error(`script ${index}: ${error.message}`);failed++;}});
          if(failed)process.exit(1);
          console.log(`validated ${scripts.length} inline scripts`);
          NODE
          node tools/test-set2.js index.html
          grep -q 'data-card-set="set1"' index.html
          grep -q 'data-card-set="set2"' index.html
          grep -q 'data-card-set="mixed"' index.html

      - name: Browser smoke test
        shell: bash
        run: |
          browser="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$browser" ]; then
            echo 'No headless browser available; syntax and rules tests already passed.'
            exit 0
          fi
          timeout 45s "$browser" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage --allow-file-access-from-files --virtual-time-budget=5000 --dump-dom "file://$PWD/index.html" > /tmp/compile-game-dom.html
          grep -q 'id="cardSetSetting"' /tmp/compile-game-dom.html
          grep -q 'data-card-set="mixed"' /tmp/compile-game-dom.html

      - name: Commit validated implementation
        shell: bash
        run: |
          rm -rf tools
          rm -f .github/workflows/export-source-for-set2.yml
          rm -f .github/workflows/apply-set2-expansion.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add selectable second card set"
          git push origin HEAD:agent/add-set2-card-pool
