name: Export source for set 2 implementation

on:
  pull_request:
    branches:
      - agent/add-set2-card-pool
    paths:
      - .github/set2-source-trigger

permissions:
  contents: read

jobs:
  export-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/add-set2-card-pool
      - uses: actions/upload-artifact@v4
        with:
          name: compile-game-source
          path: |
            index.html
            README.md
          if-no-files-found: error
