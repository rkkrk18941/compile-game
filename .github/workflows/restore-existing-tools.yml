name: Restore existing tools

on:
  pull_request:
    branches:
      - agent/add-set2-card-pool
    paths:
      - .github/restore-tools-trigger

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/add-set2-card-pool
          fetch-depth: 0
      - name: Restore tools from main
        shell: bash
        run: |
          git fetch origin main
          git checkout origin/main -- tools
          rm .github/workflows/restore-existing-tools.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Restore existing development tools"
          git push origin HEAD:agent/add-set2-card-pool
