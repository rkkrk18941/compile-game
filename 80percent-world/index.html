<html lang="en">
<head>
<meta charset="utf-8">
<!-- 80% — portal edition. Build-free: index.html + i18n.js + cg.js + engine.js + scene.js + app.js.
     Everything the game needs is in this folder (three.js r160 in ./vendor, fonts in ./fonts).
     The only outside script is the CrazyGames SDK; the game also runs without it. -->
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#050608">
<title>80%</title>
<meta name="description" content="80% to double it. 20% to lose it. A 3D push-your-luck duel across a glass table.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230b0d10'/%3E%3Ccircle cx='32' cy='32' r='21' fill='%23d9dcdf'/%3E%3Ccircle cx='32' cy='32' r='17' fill='none' stroke='%23a9adb2' stroke-width='2'/%3E%3Ctext x='32' y='39' text-anchor='middle' font-family='Arial Black,Arial' font-weight='900' font-size='18' fill='%23ff2b5a'%3E80%3C/text%3E%3C/svg%3E">
<script src="https://sdk.crazygames.com/crazygames-sdk-v3.js"></script>
<style>
@font-face{font-family:"Dela Gothic One";font-style:normal;font-weight:400;font-display:swap;src:url(fonts/dela-gothic-one-latin-400-normal.woff2) format("woff2");unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:"Dela Gothic One";font-style:normal;font-weight:400;font-display:swap;src:url(fonts/dela-gothic-one-latin-ext-400-normal.woff2) format("woff2");unicode-range:U+0100-02AF,U+1E00-1EFF,U+2020,U+20A0-20AB,U+20AD-20CF,U+2113,U+2C60-2C7F,U+A720-A7FF}
@font-face{font-family:"Dela Gothic One";font-style:normal;font-weight:400;font-display:swap;src:url(fonts/dela-gothic-one-japanese-400-normal.woff2) format("woff2");unicode-range:U+3000-30FF,U+4E00-9FFF,U+FF00-FFEF}
@font-face{font-family:"Zen Kaku Gothic New";font-style:normal;font-weight:400;font-display:swap;src:url(fonts/zen-kaku-gothic-new-latin-400-normal.woff2) format("woff2");unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:"Zen Kaku Gothic New";font-style:normal;font-weight:700;font-display:swap;src:url(fonts/zen-kaku-gothic-new-latin-700-normal.woff2) format("woff2");unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:"Zen Kaku Gothic New";font-style:normal;font-weight:900;font-display:swap;src:url(fonts/zen-kaku-gothic-new-latin-900-normal.woff2) format("woff2");unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
[hidden]{display:none!important}
:root{
  --bg:#050608; --panel:rgba(11,13,17,.94); --panel2:#14171d; --line:rgba(241,236,226,.12); --line2:rgba(241,236,226,.22);
  --ink:#f1ece2; --dim:#a8a297; --faint:#6f6a62;
  --gold:#e3b95e; --gold2:#a9822f; --gold-ink:#241a06; --red:#ec4646; --red2:#a92424; --neon:#ff2b5a; --win:#58d39a;
  --f-display:"Dela Gothic One","Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;
  --f-ui:"Zen Kaku Gothic New","Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic UI",Meiryo,sans-serif;
  --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px); --safe-l:env(safe-area-inset-left,0px); --safe-r:env(safe-area-inset-right,0px);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:14px;overflow:hidden;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;touch-action:manipulation;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
a{color:var(--gold)}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}

/* ---------- app frame: the table fills the screen, controls sit below (portrait) or to the right (landscape) */
#app{position:fixed;inset:0;display:grid;grid-template-columns:1fr;grid-template-rows:1fr auto}
#view{position:relative;overflow:hidden;min-height:0;min-width:0;background:#000}
#view canvas.gl{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
#view::after{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 55%,transparent 55%,rgba(0,0,0,.55) 100%)}
#panel{position:relative;z-index:3;background:var(--panel);border-top:1px solid var(--line);padding:10px max(12px,var(--safe-r)) calc(10px + var(--safe-b)) max(12px,var(--safe-l));display:flex;flex-direction:column;gap:8px}
#app.no-panel{grid-template-rows:1fr 0}
#app.no-panel #panel{display:none}
@media (min-aspect-ratio: 6/5){
  #app{grid-template-columns:1fr clamp(250px,28vw,340px);grid-template-rows:1fr}
  #app.no-panel{grid-template-columns:1fr 0;grid-template-rows:1fr}
  #panel{border-top:0;border-left:1px solid var(--line);padding:calc(10px + var(--safe-t)) calc(12px + var(--safe-r)) calc(10px + var(--safe-b)) 12px;overflow-y:auto;justify-content:center}
}

/* ---------- HUD */
#hud{position:absolute;z-index:2;left:0;right:0;top:0;display:flex;align-items:flex-start;gap:8px;padding:calc(8px + var(--safe-t)) max(10px,var(--safe-r)) 0 max(10px,var(--safe-l));pointer-events:none}
.plate{background:linear-gradient(180deg,rgba(10,12,16,.82),rgba(10,12,16,.62));border:1px solid var(--line);border-radius:10px;padding:6px 10px 7px;min-width:0;backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}
.plate.op{margin-left:auto;text-align:right}
.plate .nm{font-size:11px;color:var(--dim);font-weight:700;letter-spacing:.04em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:42vw}
.plate .nm b{color:var(--ink)}
.plate .cash{font-family:var(--f-display);font-size:clamp(15px,3.6vw,22px);line-height:1.15;white-space:nowrap}
.plate .sub{font-size:11px;color:var(--dim);white-space:nowrap}
.plate .debt{color:var(--red);font-weight:700}
.plate .debt:empty{display:none}
.plate.hot{border-color:rgba(227,185,94,.5)}
.round{text-align:center;background:rgba(10,12,16,.72);border:1px solid var(--line);border-radius:999px;padding:4px 10px;font-family:var(--f-display);font-size:12px;letter-spacing:.06em;white-space:nowrap;margin-top:2px}
@media (max-width: 420px){ .round{font-size:11px;padding:3px 8px} .plate{padding:5px 8px 6px} }
.round small{color:var(--dim);font-size:11px}
.round.final{border-color:var(--neon);color:#ffd1dc;box-shadow:0 0 18px rgba(255,43,90,.35)}
.bump{animation:bump .5s ease}
@keyframes bump{30%{transform:scale(1.08)}}
.up{color:var(--win)!important}.down{color:var(--red)!important}

/* tool buttons */
#tools{position:absolute;z-index:2;left:max(8px,var(--safe-l));bottom:8px;display:flex;gap:6px}
.tool{width:38px;height:38px;border-radius:50%;border:1px solid var(--line2);background:rgba(10,12,16,.7);display:grid;place-items:center;cursor:pointer;padding:0}
.tool svg{width:18px;height:18px;fill:none;stroke:var(--ink);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tool .lbl{font-weight:900;font-size:12px}
.tool[aria-pressed="false"] svg{opacity:.45}

/* banner & floating text */
#banner{position:absolute;z-index:4;left:50%;top:44%;transform:translate(-50%,-50%);pointer-events:none;text-align:center;opacity:0;white-space:nowrap}
#banner.show{animation:banner 1.15s cubic-bezier(.2,.9,.3,1) forwards}
#banner .b1{font-family:var(--f-display);font-size:clamp(34px,9vw,72px);letter-spacing:.04em;line-height:1;text-shadow:0 4px 24px rgba(0,0,0,.8)}
#banner .b2{margin-top:8px;font-size:clamp(13px,3.4vw,18px);font-weight:700;color:var(--ink);text-shadow:0 2px 10px #000}
#banner.gold .b1{color:var(--gold);text-shadow:0 0 30px rgba(227,185,94,.55),0 4px 20px #000}
#banner.red .b1{color:var(--red);text-shadow:0 0 30px rgba(236,70,70,.5),0 4px 20px #000}
#banner.neon .b1{color:#ffd9e2;text-shadow:0 0 12px var(--neon),0 0 34px var(--neon)}
@keyframes banner{0%{opacity:0;transform:translate(-50%,-50%) scale(1.25)}15%{opacity:1;transform:translate(-50%,-50%) scale(1)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-58%) scale(.98)}}
.pops{position:absolute;inset:0;pointer-events:none;z-index:3;overflow:hidden}
.pop{position:absolute;left:0;top:0;opacity:0;font-family:var(--f-display);font-size:clamp(16px,4vw,24px);white-space:nowrap;text-shadow:0 2px 8px #000,0 0 2px #000;will-change:transform}
.pop.gold{color:var(--gold)}.pop.red{color:var(--red)}.pop.white{color:var(--ink)}.pop.small{font-family:var(--f-ui);font-weight:900;font-size:13px}
.pop.big{font-size:clamp(24px,6vw,40px)}

/* ---------- panel controls */
.p-head{display:flex;align-items:baseline;gap:10px;min-height:20px}
.p-head .msg{font-size:13px;font-weight:700;color:var(--ink)}
.p-head .msg.wait{color:var(--dim)}
.sec{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:8px 10px 9px}
.sec-t{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-weight:900;font-size:13px}
.sec-t small{font-weight:700;color:var(--dim);font-size:11px}
.amt{display:flex;align-items:baseline;gap:8px;margin:2px 0 4px}
.amt .v{font-family:var(--f-display);font-size:22px;line-height:1.2}
.amt .pct{font-weight:900;color:var(--gold);font-size:14px}
#secAtk .amt .v{color:#ff9c9c}
#secAtk input[type=range],#secBorrow input[type=range]{width:100%}
#secAtk .amt .pct{color:var(--red)}
#secBorrow{border-color:rgba(236,70,70,.45)}
.slider{display:flex;align-items:center;gap:8px}
.sbtn{width:36px;height:36px;flex:none;border-radius:10px;border:1px solid var(--line2);background:#1c2027;font-size:18px;font-weight:900;cursor:pointer;line-height:1}
input[type=range]{-webkit-appearance:none;appearance:none;flex:1;min-width:0;height:36px;background:transparent;margin:0;cursor:pointer}
input[type=range]::-webkit-slider-runnable-track{height:8px;border-radius:99px;background:linear-gradient(90deg,var(--gold) 0 var(--fill,0%),#2a2f38 var(--fill,0%) 100%)}
input[type=range]::-moz-range-track{height:8px;border-radius:99px;background:#2a2f38}
input[type=range]::-moz-range-progress{height:8px;border-radius:99px;background:var(--gold)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:26px;height:26px;border-radius:50%;background:#f4efe4;border:3px solid var(--gold2);margin-top:-9px;box-shadow:0 2px 6px rgba(0,0,0,.6)}
input[type=range]::-moz-range-thumb{width:22px;height:22px;border-radius:50%;background:#f4efe4;border:3px solid var(--gold2)}
input.red[type=range]::-webkit-slider-runnable-track{background:linear-gradient(90deg,var(--red) 0 var(--fill,0%),#2a2f38 var(--fill,0%) 100%)}
input.red[type=range]::-moz-range-progress{background:var(--red)}
input.red[type=range]::-webkit-slider-thumb{border-color:var(--red2)}
.ticks{display:flex;justify-content:space-between;font-size:10px;color:var(--faint);padding:0 44px;margin-top:-4px}
.hint{margin:4px 0 0;font-size:11px;color:var(--dim)}
.risk{margin:3px 0 0;font-size:11px;line-height:1.5;color:var(--dim)}
.risk b{color:var(--ink)}
.quick{display:flex;gap:6px;margin-top:4px}
.quick button{flex:1;height:30px;border-radius:8px;border:1px solid var(--line2);background:#1c2027;font-size:12px;font-weight:700;cursor:pointer}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 16px;border-radius:12px;border:1px solid var(--line2);background:#1c2027;font-weight:900;font-size:15px;cursor:pointer;text-decoration:none;color:var(--ink)}
.btn.gold{background:linear-gradient(180deg,#f0c86c,#c79a3d);color:var(--gold-ink);border-color:#f6d790;box-shadow:inset 0 -3px 0 rgba(0,0,0,.2)}
.btn.red{background:linear-gradient(180deg,#f05a54,#b62a2a);border-color:#ff8f8a}
.btn.ghost{background:transparent}
.btn:disabled{opacity:.45;cursor:default}
.btn:active:not(:disabled){transform:translateY(1px)}
#btnGo{min-height:52px;font-family:var(--f-display);font-weight:400;font-size:20px;letter-spacing:.08em}
#btnGo.pass{background:#1c2027;color:var(--ink);border-color:var(--line2);font-family:var(--f-ui);font-weight:900;font-size:15px;letter-spacing:0}
.row2{display:flex;gap:8px}.row2>*{flex:1}
#panel.locked .sec,#panel.locked .quick{opacity:.55;pointer-events:none}
@media (max-aspect-ratio: 6/5){
  #panel{max-height:46vh;overflow-y:auto}
  .compact-portrait .hint{display:none}
}
@media (min-aspect-ratio: 6/5) and (max-height: 430px){
  #panel{gap:5px;padding-top:calc(6px + var(--safe-t));padding-bottom:calc(6px + var(--safe-b))}
  .sec{padding:5px 8px 6px}
  .amt .v{font-size:18px}
  .hint,.ticks{display:none}
  .quick button{height:26px}
  #btnGo{min-height:44px;font-size:18px}
  input[type=range]{height:30px}
  .sbtn{width:30px;height:30px}
}

/* ---------- screens (title / result) */
.screen{position:fixed;inset:0;z-index:10;display:flex;flex-direction:column;align-items:center;padding:calc(16px + var(--safe-t)) max(16px,var(--safe-r)) calc(16px + var(--safe-b)) max(16px,var(--safe-l));overflow-y:auto}
.screen>*{margin-top:auto;margin-bottom:auto;flex:none}
#title{background:radial-gradient(ellipse at 50% 40%,rgba(5,6,8,.25),rgba(5,6,8,.82) 75%)}
.t-inner{width:min(440px,100%);display:flex;flex-direction:column;align-items:stretch;gap:12px;text-align:center}
.back{align-self:flex-start;font-size:12px;font-weight:700;color:var(--dim);text-decoration:none;border:1px solid var(--line);border-radius:999px;padding:6px 12px;background:rgba(0,0,0,.4)}
.logo{margin:4px 0 0;font-family:var(--f-display);font-weight:400;font-size:clamp(76px,24vw,128px);line-height:.95;letter-spacing:-.02em;color:#ffe6ec;text-shadow:0 0 6px #fff,0 0 18px var(--neon),0 0 46px var(--neon),0 0 90px rgba(255,43,90,.6)}
.logo span{font-size:.62em}
.tag{margin:0 0 8px;font-weight:900;font-size:15px;letter-spacing:.3em;color:var(--ink);text-shadow:0 2px 10px #000}
.menu{display:flex;flex-direction:column;gap:10px;background:rgba(10,12,16,.78);border:1px solid var(--line);border-radius:16px;padding:14px;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.menu .btn.big{min-height:54px;font-size:17px}
.menu h2{margin:0;font-size:15px;font-weight:900;text-align:left}
.lbl2{font-size:12px;font-weight:700;color:var(--dim);text-align:left;margin:2px 0 -4px}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{flex:1 1 0;min-width:0;min-height:42px;border-radius:10px;border:1px solid var(--line2);background:#1c2027;font-weight:900;cursor:pointer;padding:4px 6px;line-height:1.2}
.seg button small{display:block;font-size:10px;font-weight:700;color:var(--dim)}
.seg button[aria-pressed="true"]{background:var(--gold);color:var(--gold-ink);border-color:#f6d790}
.seg button[aria-pressed="true"] small{color:#5a4310}
.seg.opps button{flex:1 1 40%}
.field{display:flex;flex-direction:column;gap:4px;text-align:left;font-size:12px;font-weight:700;color:var(--dim)}
.field input{height:44px;border-radius:10px;border:1px solid var(--line2);background:#0d0f13;color:var(--ink);font:inherit;font-size:16px;font-weight:700;padding:0 12px}
#codeInput{text-transform:uppercase;letter-spacing:.4em;text-align:center;font-family:var(--f-display);font-size:22px}
.code{font-family:var(--f-display);font-size:44px;letter-spacing:.25em;color:var(--gold);margin:-4px 0 0}
.status{font-size:13px;color:var(--dim);margin:0}
.err{font-size:13px;color:#ff8f8a;margin:0;min-height:1em}
.rec{font-size:12px;color:var(--dim);margin:2px 0 0}
.tabs{display:flex;gap:6px}.tabs button{flex:1;min-height:38px;border-radius:10px;border:1px solid var(--line2);background:transparent;font-weight:900;cursor:pointer}
.tabs button[aria-pressed="true"]{background:#2a2f38;border-color:var(--ink)}

#result{background:rgba(3,4,6,.72);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px)}
.r-card{width:min(560px,100%);background:rgba(12,14,18,.95);border:1px solid var(--line2);border-radius:18px;padding:16px 18px;display:flex;flex-direction:column;gap:8px;text-align:center}
@media (max-height: 500px){ .r-card{padding:12px 14px;gap:6px} #resTitle{font-size:38px} .stats{font-size:11px;gap:2px 10px} }
.r-kicker{margin:0;font-size:12px;letter-spacing:.2em;color:var(--dim);font-weight:700}
#resTitle{margin:0;font-family:var(--f-display);font-weight:400;font-size:clamp(40px,12vw,64px);line-height:1.05}
#resTitle.win{color:var(--gold);text-shadow:0 0 30px rgba(227,185,94,.45)}
#resTitle.lose{color:var(--red)}
#resSub{margin:0;font-size:14px;color:var(--ink)}
#chart{width:100%;height:clamp(110px,26vh,180px);border-radius:10px;background:#0b0d11;border:1px solid var(--line)}
.legend{display:flex;justify-content:center;gap:14px;font-size:12px;color:var(--dim);margin-top:-4px}
.legend i{display:inline-block;width:14px;height:3px;border-radius:2px;vertical-align:middle;margin-right:5px}
.stats{display:grid;grid-template-columns:auto 1fr 1fr;gap:4px 10px;font-size:12px;text-align:right;margin:0}
.stats .h{color:var(--dim);font-weight:700}
.stats .k{text-align:left;color:var(--dim)}

/* modal */
.modal{position:fixed;inset:0;z-index:20;display:grid;place-items:center;background:rgba(0,0,0,.66);padding:16px}
.m-card{width:min(520px,100%);max-height:88vh;overflow-y:auto;background:#101318;border:1px solid var(--line2);border-radius:16px;padding:18px 18px 14px;text-align:left}
.m-card h2{margin:0 0 8px;font-family:var(--f-display);font-weight:400;font-size:24px}
.m-card ol{margin:0;padding-left:1.3em;line-height:1.75;font-size:14px}
.m-card li{margin-bottom:6px}
.m-card b{color:var(--gold)}
.m-card .red{color:#ff8f8a}
.m-card .btn{width:100%;margin-top:12px}
#dlg .m-card p{margin:0 0 12px;font-size:15px;line-height:1.6}

/* loader */
#loader{position:fixed;inset:0;z-index:30;display:grid;place-items:center;background:var(--bg);text-align:center}
#loader .l1{font-family:var(--f-display);font-size:56px;color:#ffe6ec;text-shadow:0 0 18px var(--neon),0 0 40px var(--neon)}
#loader .l2{color:var(--dim);font-size:13px;margin-top:10px}
#loader.err .l2{color:#ff8f8a}
#toast{position:fixed;left:50%;bottom:calc(20px + var(--safe-b));transform:translateX(-50%);z-index:40;background:var(--ink);color:#111;font-weight:900;font-size:13px;padding:9px 16px;border-radius:999px;max-width:calc(100vw - 32px);text-align:center}
@media (prefers-reduced-motion: reduce){#banner.show{animation-duration:.6s}}
/* ---------- portal edition */
#oppNote:empty{display:none}
/* messages sit under the HUD so they never cover the controls */
#toast{bottom:auto;top:calc(58px + var(--safe-t))}
#app.no-panel ~ #toast{top:auto;bottom:calc(20px + var(--safe-b))}
#oppNote{font-size:12px;line-height:1.6;font-weight:500;letter-spacing:0;opacity:.85}
.seg.opps button{flex:1 1 30%}
[data-lang="en"] .tag{letter-spacing:.16em;font-size:14px}
[data-lang="en"] #banner .b1{letter-spacing:.02em}
[data-lang="en"] #btnGo.pass{font-size:14px}
[data-lang="en"] .stats{font-size:12px}
/* short iframes (821×462 and the like): keep the whole menu on one screen */
@media (max-height: 560px){
  .screen{padding-top:calc(8px + var(--safe-t));padding-bottom:calc(8px + var(--safe-b))}
  .t-inner{gap:6px}
  .logo{font-size:clamp(56px,19vh,104px)}
  .tag{margin-bottom:2px}
  .menu{padding:10px;gap:7px}
  .menu .btn.big{min-height:46px}
  .menu .btn{min-height:40px}
  .seg button{min-height:38px}
}
@media (max-height: 560px) and (min-aspect-ratio: 6/5){
  #title .t-inner{width:min(760px,100%);display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.25fr);align-items:center;column-gap:22px}
  #title .logo{grid-column:1;grid-row:1;align-self:end}
  #title .tag{grid-column:1;grid-row:2;align-self:start}
  #title .menu{grid-column:2;grid-row:1 / span 2}
}
/* large screens (fullscreen 1080p and up): the interface grows with the picture so text stays easy to read */
@media (min-width: 1500px) and (min-height: 780px){
  #app{grid-template-columns:1fr 442px}
  #app.no-panel{grid-template-columns:1fr 0}
  #panel,#hud,#tools,#toast,.t-inner,.r-card,.m-card{zoom:1.3}
  #banner .b1{font-size:96px}
  #banner .b2{font-size:24px}
  .pop{font-size:32px}.pop.big{font-size:54px}.pop.small{font-size:17px}
}
</style>
</head>
<body>
<div id="app" class="no-panel">
  <div id="view">
    <div id="hud" hidden>
      <div class="plate me" id="plate0"><div class="nm"><b id="hudNm0" data-i18n="you"></b></div><div class="cash num" id="hudCash0">¥10,000</div><div class="sub num"><span class="debt" id="hudDebt0"></span> <span data-i18n="net"></span> <span id="hudNet0">¥10,000</span></div></div>
      <div class="round" id="hudRound">ROUND 1<small> / 10</small></div>
      <div class="plate op" id="plate1"><div class="nm"><b id="hudNm1" data-i18n="opp"></b></div><div class="cash num" id="hudCash1">¥10,000</div><div class="sub num"><span class="debt" id="hudDebt1"></span> <span data-i18n="net"></span> <span id="hudNet1">¥10,000</span></div></div>
    </div>
    <div id="banner"><div class="b1"></div><div class="b2"></div></div>
    <div id="tools" hidden>
      <button class="tool" id="btnSound" type="button" aria-pressed="true" data-i18n-aria="ariaSound"><svg viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9z"/><path d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/></svg></button>
      <button class="tool" id="btnSpeed" type="button" data-i18n-aria="ariaSpeed"><span class="lbl">×1</span></button>
      <button class="tool" id="btnHelp" type="button" data-i18n-aria="ariaHelp"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.6 2.6 0 0 1 5 1c0 1.8-2.5 2.2-2.5 3.8M12 17.2v.3"/></svg></button>
      <button class="tool" id="btnQuit" type="button" data-i18n-aria="ariaQuit"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    </div>
  </div>

  <aside id="panel" data-i18n-aria="ariaPanel">
    <div class="p-head"><span class="msg" id="pMsg" data-i18n="pChoose"></span></div>
    <section class="sec" id="secBorrow" hidden>
      <div class="sec-t"><span data-i18n="borrowTitle"></span> <small><span data-i18n="borrowMaxLbl"></span> <span class="num" id="borrowMax">¥0</span></small></div>
      <div class="amt"><span class="v num" id="borrowAmt">¥0</span><span class="pct" id="borrowPct">100%</span></div>
      <input type="range" id="borrowRange" min="1" max="10" step="1" value="10" data-i18n-aria="ariaBorrow">
      <p class="risk" data-i18n="borrowRisk"></p>
      <p class="risk" id="borrowPreview" aria-live="polite"></p>
      <div class="row2" style="margin-top:6px"><button class="btn red" id="btnBorrow" type="button" data-i18n="btnBorrow"></button><button class="btn ghost" id="btnNoBorrow" type="button" data-i18n="btnNoBorrow"></button></div>
    </section>
    <section class="sec" id="secBet">
      <div class="sec-t"><span data-i18n="betTitle"></span> <small data-i18n="betSub"></small></div>
      <div class="amt"><span class="v num" id="betAmt">¥0</span><span class="pct" id="betPct">0%</span></div>
      <div class="slider"><button class="sbtn" id="betMinus" type="button" data-i18n-aria="ariaMinus">−</button><input type="range" id="betRange" min="0" max="10" step="1" value="0" data-i18n-aria="ariaBet"><button class="sbtn" id="betPlus" type="button" data-i18n-aria="ariaPlus">＋</button></div>
      <div class="quick"><button type="button" data-k="0">0%</button><button type="button" data-k="5">50%</button><button type="button" data-k="10" data-i18n="allIn"></button></div>
      <p class="hint" data-i18n="hintPiles"></p>
    </section>
    <section class="sec" id="secAtk" hidden>
      <div class="sec-t"><span data-i18n="atkTitle"></span> <small><span data-i18n="atkSub"></span> <span class="num" id="opDebt">¥0</span></small></div>
      <div class="amt"><span class="v num" id="atkAmt">¥0</span><span class="pct" id="atkPct">0%</span></div>
      <input type="range" class="red" id="atkRange" min="0" max="10" step="1" value="0" data-i18n-aria="ariaAtk">
      <p class="risk" id="atkRisk"></p>
    </section>
    <button class="btn gold" id="btnGo" type="button" data-i18n="go"></button>
  </aside>
</div>

<section class="screen" id="title" hidden>
  <div class="t-inner">
    <h1 class="logo">80<span>%</span></h1>
    <p class="tag" data-i18n="tag"></p>
    <div class="menu" id="menuMain">
      <button class="btn big gold" id="btnPlay" type="button" data-i18n="play"></button>
      <button class="btn" id="btnCpu" type="button" data-i18n="setup"></button>
      <button class="btn ghost" id="btnRules" type="button" data-i18n="rules"></button>
      <p class="rec num" id="recLine"></p>
    </div>
    <div class="menu" id="menuCpu" hidden>
      <h2 data-i18n="setupTitle"></h2>
      <p class="lbl2" data-i18n="lblRounds"></p>
      <div class="seg" id="cpuRounds"><button type="button" data-v="5">5</button><button type="button" data-v="10" aria-pressed="true">10</button><button type="button" data-v="15">15</button><button type="button" data-v="20">20</button></div>
      <p class="lbl2" data-i18n="lblOpp"></p>
      <div class="seg opps" id="cpuOpp">
        <button type="button" data-v="careful"><span data-i18n="n_careful"></span><small data-i18n="t_careful"></small></button>
        <button type="button" data-v="calc" aria-pressed="true"><span data-i18n="n_calc"></span><small data-i18n="t_calc"></small></button>
        <button type="button" data-v="mad"><span data-i18n="n_mad"></span><small data-i18n="t_mad"></small></button>
        <button type="button" data-v="random"><span data-i18n="n_random"></span><small data-i18n="t_random"></small></button>
        <button type="button" data-v="max"><span data-i18n="n_max"></span><small data-i18n="t_max"></small></button>
      </div>
      <p class="lbl2" id="oppNote"></p>
      <button class="btn big gold" id="btnCpuStart" type="button" data-i18n="takeSeat"></button>
      <button class="btn ghost" type="button" data-back data-i18n="back"></button>
    </div>
  </div>
</section>

<section class="screen" id="result" hidden>
  <div class="r-card">
    <p class="r-kicker" id="resKicker">FINAL</p>
    <h2 id="resTitle"></h2>
    <p id="resSub" class="num"></p>
    <canvas id="chart" data-i18n-aria="ariaChart"></canvas>
    <div class="legend"><span><i id="lgMe"></i><span id="lgMeNm" data-i18n="you"></span></span><span><i id="lgOp"></i><span id="lgOpNm" data-i18n="opp"></span></span></div>
    <div class="stats num" id="resStats"></div>
    <div class="row2"><button class="btn gold" id="btnAgain" type="button" data-i18n="again"></button><button class="btn ghost" id="btnToTitle" type="button" data-i18n="toTitle"></button></div>
  </div>
</section>

<div class="modal" id="rules" hidden>
  <div class="m-card" role="dialog" aria-modal="true" aria-labelledby="rulesH">
    <h2 id="rulesH" data-i18n="rulesH"></h2>
    <ol id="rulesList"></ol>
    <button class="btn gold" id="btnRulesClose" type="button" data-i18n="gotIt"></button>
  </div>
</div>

<div class="modal" id="dlg" hidden>
  <div class="m-card" role="alertdialog" aria-modal="true">
    <p id="dlgText"></p>
    <div class="row2" id="dlgBtns"></div>
  </div>
</div>

<div id="loader"><div><div class="l1">80%</div><div class="l2" id="loaderMsg" data-i18n="loading"></div></div></div>
<div id="toast" hidden></div>

<script src="i18n.js"></script>
<script>window.EIGHTY_I18N.applyDom();</script>
<script src="cg.js"></script>
<script src="engine.js"></script>
<script type="module" src="app.js"></script>
</body>
</html>
