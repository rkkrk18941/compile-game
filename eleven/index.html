    <div class="turn-t"><b id="tTurn">TURN 1</b><span id="tInfo"></span></div>
    <div class="spacer"></div>

    <button class="iconbtn" id="btnRules" aria-label="あそびかた"><svg class="ic"><use href="#i-help"/></svg></button>

  <section id="rivals" aria-label="ほかのプレイヤー"></section>

    <div id="spot" aria-hidden="true"></div>

    <div id="stamp" aria-hidden="true"></div>

  <div id="prompt" aria-live="polite"></div>

  <div id="actions"></div>
  <div id="hand" role="group" aria-label="手札"></div>

<!-- title -->

    <h1 class="title">イレブン</h1>
    <p class="title-en">ELEVEN</p>
    <p class="tagline">数字をつないで、手札を減らせ。<br>同じ色で出し切れば得点。<br>先に<b>11</b>点を集めた人の勝ち。</p>
    <div class="stack">
      <button class="btn primary big" id="goResume" hidden>続きから</button>
      <button class="btn primary big" id="goCpu">CPUと対戦</button>
      <button class="btn big" id="goLocal">みんなで対戦<small>1台を回して</small></button>
      <div class="rowbtns"><button class="btn" id="goRules">あそびかた</button><button class="btn" id="goSound"></button></div>
    </div>
    <p class="credit">ボードゲーム『イレブン』（ゲームデザイン：佐藤雄介／原作：新ボードゲーム党・ケンビル）のルールで遊べる、個人で楽しむための非公式ファンメイド版です。カードの絵柄はこのページのために描いたオリジナルで、製品版のアートは使用していません。<a href="https://gamemarket.jp/game/181703" target="_blank" rel="noopener">原作の紹介</a></p>
  </div>
</section>

    <div class="field" id="fieldLevel"><span>CPUの強さ</span><div class="seg" id="segLevel"><button data-v="easy">やさしい</button><button data-v="normal">ふつう</button></div></div>
    <div class="field" id="fieldRivals"><span>対戦相手</span><div class="rivals-preview" id="rivalPreview"></div></div>
    <div class="field" id="fieldNames"><span>名前（そのままでもOK）</span><div class="names" id="nameList"></div></div>
    <p class="note" id="setupNote"></p>
    <div class="rowbtns"><button class="btn ghost" data-back>もどる</button><button class="btn primary" id="startBtn">はじめる</button></div>
  </div>
</section>
