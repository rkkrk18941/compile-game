<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b1110"><title>Mist Maze Online v19</title></head><body style="margin:0;min-height:100dvh;display:grid;place-items:center;background:#0b1110;color:#e8eeeb;font-family:system-ui,sans-serif"><div id="load">ゲームを読み込んでいます…</div><script>(async()=>{try{let pakoReady=null;async function ungzip64(b){const u=Uint8Array.from(atob(b.trim()),c=>c.charCodeAt(0));if('DecompressionStream'in window){const ds=new DecompressionStream('gzip');return await new Response(new Blob([u]).stream().pipeThrough(ds)).text()}if(!pakoReady)pakoReady=new Promise((ok,ng)=>{const s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/pako@2.1.0/dist/pako.min.js';s.onload=ok;s.onerror=ng;document.head.appendChild(s)});await pakoReady;return pako.ungzip(u,{to:'string'})}const names=['p0','p1','p2a','p2b','p2c','p2d','p3'];const [parts,patch64]=await Promise.all([Promise.all(names.map(n=>fetch(`${n}.txt?v=18`).then(r=>{if(!r.ok)throw new Error(`${n}: ${r.status}`);return r.text()}))),fetch('v19patch.txt?v=19').then(r=>{if(!r.ok)throw new Error(`patch: ${r.status}`);return r.text()})]);let html=await ungzip64(parts.join(''));const patch=JSON.parse(await ungzip64(patch64));let lines=html.split('\n');if(lines.length!==patch.baseLines)throw new Error(`基礎データ不一致: ${lines.length}/${patch.baseLines}`);for(let i=patch.ops.length-1;i>=0;i--){const [a,b,x]=patch.ops[i];lines.splice(a,b-a,...x)}html=lines.join('\n');document.open();document.write(html);document.close()}catch(e){document.getElementById('load').innerHTML='読み込みに失敗しました。<br><small>'+String(e)+'</small>'}})();</script></body></html>
