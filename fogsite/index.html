<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b1110"><title>Mist Maze Online</title></head><body style="margin:0;min-height:100dvh;display:grid;place-items:center;background:#0b1110;color:#e8eeeb;font-family:system-ui,sans-serif"><div id="load">ゲームを読み込んでいます…</div><script>(async()=>{try{const parts=await Promise.all([0,1,2,3].map(i=>fetch(`p${i}.txt?v=18`).then(r=>{if(!r.ok)throw new Error(`data ${i}: ${r.status}`);return r.text()})));const b=parts.join('').trim();const u=Uint8Array.from(atob(b),c=>c.charCodeAt(0));let html;if('DecompressionStream'in window){const ds=new DecompressionStream('gzip');html=await new Response(new Blob([u]).stream().pipeThrough(ds)).text()}else{await new Promise((ok,ng)=>{const s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/pako@2.1.0/dist/pako.min.js';s.onload=ok;s.onerror=ng;document.head.appendChild(s)});html=pako.ungzip(u,{to:'string'})}document.open();document.write(html);document.close()}catch(e){document.getElementById('load').innerHTML='読み込みに失敗しました。<br><small>'+String(e)+'</small>'}})();</script></body></html>
