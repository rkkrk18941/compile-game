<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<!-- ミエナイ・ファイブ: build-free single file. Publish as-is (UTF-8, do not reformat or minify). Runtime libraries: three.js r128 (cdnjs), PeerJS 1.5.4 (jsDelivr/unpkg), Google Fonts. Online play = PeerJS, no server or API key needed. -->
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0d1411">
<title>ミエナイ・ファイブ</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Mochiy+Pop+One&family=Zen+Maru+Gothic:wght@500;700;900&display=swap">
<style>
[hidden]{display:none!important}
/* Layout: phone-first. The 3D card table takes the top, a slim action strip sits under it,
   and the deduction memo stays docked below (to the right on landscape and desktop). */
:root {
  --ink: #fbf5e6;
  --ink-dim: #b8c3b6;
  --ink-faint: #7f8d82;
  --panel: rgba(13, 22, 18, 0.86);
  --panel-solid: #121e19;
  --panel-raise: #1a2a23;
  --dock: #101a16;
  --line: rgba(251, 245, 230, 0.14);
  --brass: #f2c14e;
  --brass-deep: #b98a2c;
  --brass-ink: #2a1e05;
  --go: #48c487;
  --stop: #f2665a;
  --t-g: #2c9a5a; --t-p: #ec7aad; --t-b: #3889dc; --t-r: #de4438; --t-o: #f29526;
  --font-display: "Mochiy Pop One", "Zen Maru Gothic", "Hiragino Maru Gothic ProN", system-ui, sans-serif;
  --font-ui: "Zen Maru Gothic", "Hiragino Maru Gothic ProN", "Hiragino Sans", "Noto Sans JP", system-ui, sans-serif;
  --font-num: "Fredoka", "Arial Rounded MT Bold", "Zen Maru Gothic", system-ui, sans-serif;
  --r-sm: 10px; --r-md: 14px; --r-lg: 20px;
  --safe-t: env(safe-area-inset-top, 0px);
  --safe-b: env(safe-area-inset-bottom, 0px);
  color-scheme: dark;
}
html, body { height: 100%; }
body { margin: 0; background: #0d1411; color: var(--ink); font-family: var(--font-ui); font-size: 14px; overflow: hidden; -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; touch-action: manipulation; }
button { font: inherit; color: inherit; }
button:focus-visible, input:focus-visible, select:focus-visible, [tabindex]:focus-visible { outline: 3px solid var(--brass); outline-offset: 2px; }

/* ---------- app grid ---------- */
#app { position: fixed; inset: 0; padding: var(--safe-t) 0 var(--safe-b); box-sizing: border-box; display: grid;
  grid-template-columns: minmax(0, 1fr); grid-template-rows: auto minmax(0, 1fr) auto;
  grid-template-areas: "top" "stage" "memo"; }
#topbar { grid-area: top; }
#stageWrap { grid-area: stage; position: relative; min-height: 0; overflow: hidden; }
/* the action strip floats over the bottom of the table so the table never resizes while you pick */
#actionbar { grid-area: stage; align-self: end; z-index: 5; }
#memoDock { grid-area: memo; }
#stage { position: absolute; inset: 0; touch-action: none; }
#stage canvas { display: block; }
#tags { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }

/* ---------- top bar ---------- */
#topbar { display: flex; align-items: center; gap: 8px; padding: 6px 10px; background: var(--dock); border-bottom: 1px solid var(--line); min-width: 0; }
.brand { font-family: var(--font-display); font-size: 15px; color: var(--brass); padding: 4px 6px; white-space: nowrap; }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px; border-radius: 999px; background: var(--panel-raise); border: 1px solid var(--line); font-weight: 700; white-space: nowrap; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
.chip.mine { background: var(--brass); color: var(--brass-ink); border-color: transparent; }
.chip .dot { width: 8px; height: 8px; border-radius: 50%; background: currentColor; flex: none; }
#turnChip { flex: 0 1 auto; min-width: 0; }
#turnText { overflow: hidden; text-overflow: ellipsis; }
#roomChip { font-family: var(--font-num); letter-spacing: 0.08em; }
.spacer { flex: 1; }
.iconbtn { width: 38px; height: 38px; flex: none; display: grid; place-items: center; border-radius: 11px; background: var(--panel-raise); border: 1px solid var(--line); cursor: pointer; padding: 0; }
.iconbtn svg { width: 19px; height: 19px; stroke: var(--ink); fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.iconbtn.sm { width: 32px; height: 32px; border-radius: 9px; }
.iconbtn.sm svg { width: 16px; height: 16px; }
.iconbtn:active { transform: translateY(1px); }

/* ---------- name tags on the table ---------- */
.tag { position: absolute; transform: translate(-50%, -100%); display: flex; align-items: center; gap: 5px; padding: 3px 9px 3px 3px; border-radius: 999px; background: var(--panel); border: 1px solid var(--line); white-space: nowrap; font-weight: 700; font-size: 12px; }
.tag .av { width: 20px; height: 20px; border-radius: 50%; display: grid; place-items: center; font-size: 11px; font-family: var(--font-display); color: var(--brass-ink); background: var(--brass); }
.tag .st { font-size: 10px; font-weight: 700; color: var(--ink-dim); }
.tag.turn { border-color: var(--brass); box-shadow: 0 0 0 3px rgba(242,193,78,.25); }
.tag.out { opacity: .55; }
.tag.out .av { background: var(--ink-faint); }
.tag.off .st { color: var(--stop); }

/* ---------- action strip ---------- */
#actionbar { display: flex; align-items: center; flex-wrap: wrap; gap: 6px 8px; padding: 7px 10px; background: linear-gradient(to top, rgba(16,26,22,.97) 70%, rgba(16,26,22,.82)); border-top: 1px solid var(--line); min-height: 50px; box-sizing: border-box; }
#prompt { flex: 1 1 160px; min-width: 0; font-weight: 700; line-height: 1.35; font-size: 14px; }
#prompt b { color: var(--brass); font-family: var(--font-num); font-size: 16px; }
#prompt .step { display: inline-grid; place-items: center; width: 20px; height: 20px; margin-right: 6px; border-radius: 50%; background: var(--brass); color: var(--brass-ink); font-family: var(--font-num); font-size: 12px; vertical-align: -3px; }
#actions { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.btn { min-height: 42px; padding: 0 15px; border-radius: var(--r-md); border: 1px solid var(--line); background: var(--panel-raise); font-weight: 700; font-size: 15px; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 8px; }
.btn.primary { background: var(--brass); color: var(--brass-ink); border-color: transparent; }
.btn.ghost { background: transparent; }
.btn.danger { background: var(--stop); color: #2a0703; border-color: transparent; }
.btn.sm { min-height: 36px; padding: 0 12px; font-size: 14px; border-radius: 11px; }
.btn:disabled { opacity: .45; cursor: default; }
.btn:not(:disabled):active { transform: translateY(1px); }
.colorchip { min-height: 40px; min-width: 40px; padding: 0 8px; border-radius: 11px; border: 2px solid transparent; font-family: var(--font-num); font-weight: 600; font-size: 16px; color: #fff; display: inline-flex; align-items: center; justify-content: center; gap: 5px; cursor: pointer; }
.colorchip svg { width: 14px; height: 14px; fill: rgba(255,248,234,.95); }
.colorchip[aria-pressed="true"] { border-color: var(--brass); box-shadow: 0 0 0 3px rgba(242,193,78,.35); }
#fiveBtn { flex: none; min-height: 38px; padding: 0 14px; border-radius: 999px; border: 0; cursor: pointer; background: linear-gradient(180deg, #ffd978, var(--brass) 60%, var(--brass-deep)); color: var(--brass-ink); font-family: var(--font-display); font-size: 14px; box-shadow: 0 3px 0 #7d5a14; white-space: nowrap; }
#fiveBtn:active { transform: translateY(2px); box-shadow: 0 1px 0 #7d5a14; }
#fiveBtn.pulse { animation: pulse 1.1s ease-in-out infinite; }
@keyframes pulse { 50% { transform: scale(1.06); } }

/* ---------- tile info, toasts, stamp (over the table) ---------- */
#tileInfo { position: absolute; left: 8px; top: 8px; z-index: 6; pointer-events: none; width: max-content; max-width: min(300px, calc(100% - 12px)); box-sizing: border-box; display: flex; align-items: center; gap: 8px; padding: 6px 10px 6px 6px; border-radius: var(--r-md); background: var(--panel-solid); border: 1px solid var(--line); box-shadow: 0 8px 22px rgba(0,0,0,.4); }
#tileInfo .mini { flex: none; }
#tileInfo .txt { min-width: 0; line-height: 1.35; }
#tileInfo .txt b { font-size: 16px; font-family: var(--font-num); }
#tileInfo .txt .meta { white-space: nowrap; font-weight: 700; margin-left: 6px; }
#tileInfo .txt span { color: var(--ink-dim); font-size: 12px; }
.mini { width: 32px; height: 38px; border-radius: 8px; display: grid; place-items: center; font-family: var(--font-num); font-weight: 700; font-size: 16px; color: #fff8ea; text-shadow: 0 1px 0 rgba(0,0,0,.35); position: relative; flex: none; }
.mini i { position: absolute; bottom: 4px; left: 0; right: 0; display: flex; justify-content: center; gap: 2px; }
.mini i span { width: 4px; height: 4px; border-radius: 50%; background: #fff8ea; }
.mini svg { width: 17px; height: 17px; fill: rgba(255,248,234,.95); }
#toasts { position: absolute; top: 5px; left: 50%; transform: translateX(-50%); display: flex; flex-direction: column; align-items: center; gap: 5px; z-index: 4; pointer-events: none; width: min(94%, 520px); }
.toast { padding: 4px 12px; border-radius: 999px; background: var(--panel-solid); border: 1px solid var(--line); font-weight: 700; font-size: 12px; text-align: center; animation: tin .25s ease-out; max-width: 100%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; box-sizing: border-box; }
.toast b { color: var(--brass); font-family: var(--font-num); }
.toast.me { border-color: var(--brass); }
.toast.bye { animation: tout .3s ease-in forwards; }
@keyframes tin { from { opacity: 0; transform: translateY(-8px); } }
@keyframes tout { to { opacity: 0; transform: translateY(-8px); } }
#stamp { position: absolute; left: 50%; top: 46%; transform: translate(-50%, -50%); z-index: 7; pointer-events: none; font-family: var(--font-display); font-size: clamp(28px, 9vw, 60px); padding: 8px 24px; border-radius: 20px; border: 5px solid currentColor; background: rgba(13,22,18,.84); opacity: 0; white-space: nowrap; }
#stamp.show { animation: stamp 1.7s ease-out forwards; }
#stamp.yes { color: var(--go); } #stamp.no { color: var(--stop); } #stamp.info { color: var(--brass); }
#stamp small { display: block; font-family: var(--font-ui); font-weight: 900; font-size: .32em; text-align: center; color: var(--ink); }
@keyframes stamp { 0% { opacity: 0; transform: translate(-50%, -50%) scale(1.6) rotate(-8deg); } 12% { opacity: 1; transform: translate(-50%, -50%) scale(1) rotate(-4deg); } 80% { opacity: 1; } 100% { opacity: 0; transform: translate(-50%, -50%) scale(.96) rotate(-4deg); } }

/* ---------- docked memo ---------- */
#memoDock { background: var(--dock); border-top: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; }
.memo-head { display: flex; align-items: center; gap: 8px; padding: 6px 10px 2px; }
.memo-head b { font-family: var(--font-display); font-weight: 400; font-size: 14px; color: var(--brass); white-space: nowrap; }
.memo-hint { flex: 1; min-width: 0; font-size: 11px; color: var(--ink-faint); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.mini-toggle { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 700; color: var(--ink-dim); white-space: nowrap; cursor: pointer; min-height: 32px; }
.mini-toggle input { width: 17px; height: 17px; margin: 0; accent-color: var(--brass); }
.memo-body { padding: 4px 10px 8px; display: flex; flex-direction: column; gap: 6px; min-height: 0; overflow: auto; }
#memoDock.folded .memo-body { display: none; }
#memoDock.folded #mFold svg { transform: rotate(180deg); }
/* rows = my slots ①..⑤, columns = that colour's 12 numbers */
.mgrid { display: grid; grid-template-columns: 36px repeat(12, minmax(0, 1fr)); gap: 3px; }
.mlab { display: flex; align-items: center; justify-content: center; gap: 2px; border-radius: 8px; font-weight: 900; font-size: 13px; background: var(--panel-raise); min-height: 30px; }
.mlab svg { width: 11px; height: 11px; }
.mlab.done { background: var(--brass); color: var(--brass-ink); }
.mlab.done svg { fill: var(--brass-ink) !important; }
.mcell { position: relative; min-height: 30px; border-radius: 7px; border: 0; padding: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; font-family: var(--font-num); font-weight: 700; font-size: 13px; line-height: 1; color: #fff8ea; cursor: pointer; text-shadow: 0 1px 0 rgba(0,0,0,.3); }
.mcell i { display: flex; gap: 1.5px; margin-top: 2px; }
.mcell i span { width: 3px; height: 3px; border-radius: 50%; background: #fff8ea; }
.mcell.seen { opacity: .18; }
.mcell.seen::after { content: ""; position: absolute; inset: 5px 3px; background: linear-gradient(to top right, transparent calc(50% - 1px), #fff8ea calc(50% - 1px), #fff8ea calc(50% + 1px), transparent calc(50% + 1px)); }
.mcell.x { opacity: .28; }
.mcell.x::after { content: "×"; position: absolute; inset: 0; display: grid; place-items: center; font-size: 22px; font-family: var(--font-ui); font-weight: 900; color: #160c08; text-shadow: none; opacity: .8; }
.mcell.auto { opacity: .26; }
.mcell.o { box-shadow: inset 0 0 0 2.5px #fff8ea; }
.mcell.last { outline: 2.5px solid var(--brass); outline-offset: 1px; }
.mclues { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px; scrollbar-width: none; }
.mclues::-webkit-scrollbar { display: none; }
.mclue { flex: none; display: inline-flex; align-items: center; gap: 5px; padding: 3px 8px 3px 3px; border-radius: 9px; background: var(--panel-raise); font-size: 12px; font-weight: 700; white-space: nowrap; }
.mclue .mini { width: 22px; height: 26px; font-size: 12px; border-radius: 6px; }
.mclue .mini i { bottom: 2px; }
.mclue .mini i span { width: 3px; height: 3px; }
.mclue .y { color: var(--go); } .mclue .n { color: var(--stop); } .mclue .p { color: var(--brass); }
.mclues .none { font-size: 12px; color: var(--ink-faint); }

/* ---------- screens ---------- */
.screen { position: fixed; inset: 0; z-index: 10; display: flex; flex-direction: column; padding: calc(var(--safe-t) + 16px) 16px calc(var(--safe-b) + 16px); background: radial-gradient(ellipse at 50% 40%, rgba(13,20,17,.35), rgba(13,20,17,.8)); overflow-y: auto; }
.card { margin: auto; box-sizing: border-box; width: min(440px, 100%); background: var(--panel); border: 1px solid var(--line); border-radius: var(--r-lg); padding: 22px 20px; display: flex; flex-direction: column; gap: 14px; backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); box-shadow: 0 20px 50px rgba(0,0,0,.45); }
.logo { font-family: var(--font-display); font-size: clamp(34px, 10vw, 46px); line-height: 1.05; text-align: center; color: var(--ink); text-wrap: balance; }
.logo em { font-style: normal; color: var(--brass); }
.logo .tiles { display: flex; justify-content: center; gap: 6px; margin-bottom: 10px; }
.logo .tiles .mini { width: 30px; height: 36px; font-size: 15px; }
.tagline { text-align: center; color: var(--ink-dim); line-height: 1.6; margin: 0; text-wrap: balance; }
.card h2 { margin: 0; font-family: var(--font-display); font-size: 22px; font-weight: 400; }
.stack { display: flex; flex-direction: column; gap: 10px; }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.row > .btn { flex: 1 1 0; }
.field { display: flex; flex-direction: column; gap: 6px; }
.field > span { font-size: 12px; font-weight: 700; color: var(--ink-dim); letter-spacing: .04em; }
.input { min-height: 46px; padding: 0 14px; border-radius: var(--r-md); border: 1px solid var(--line); background: #0c1612; color: var(--ink); font: inherit; font-size: 16px; font-weight: 700; width: 100%; box-sizing: border-box; user-select: text; -webkit-user-select: text; }
.input.code { font-family: var(--font-num); font-size: 26px; letter-spacing: .3em; text-align: center; }
.seg { display: flex; padding: 4px; border-radius: var(--r-md); background: #0c1612; border: 1px solid var(--line); gap: 4px; }
.seg button { flex: 1; min-height: 40px; border: 0; border-radius: 10px; background: transparent; font-weight: 700; cursor: pointer; color: var(--ink-dim); }
.seg button[aria-pressed="true"] { background: var(--brass); color: var(--brass-ink); }
.note { font-size: 12px; color: var(--ink-dim); line-height: 1.6; margin: 0; }
.note.warn { color: var(--stop); }
.credit { font-size: 11px; color: var(--ink-faint); text-align: center; line-height: 1.6; margin: 0; }
.bigcode { font-family: var(--font-num); font-weight: 700; font-size: 48px; letter-spacing: .22em; text-align: center; color: var(--brass); padding: 6px 0 0 .22em; }
.seats { display: flex; flex-direction: column; gap: 6px; }
.seat { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: var(--r-md); background: var(--panel-raise); border: 1px solid var(--line); min-height: 44px; }
.seat .nm { flex: 1; min-width: 0; font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.seat .who { font-size: 11px; color: var(--ink-dim); font-weight: 700; }
.seat select { min-height: 34px; border-radius: 8px; background: #0c1612; color: var(--ink); border: 1px solid var(--line); font: inherit; font-weight: 700; }
.seat .x { width: 34px; height: 34px; border-radius: 8px; border: 1px solid var(--line); background: transparent; cursor: pointer; }

/* ---------- sheets & modals ---------- */
.scrim { position: fixed; inset: 0; z-index: 20; background: rgba(5,9,7,.55); display: flex; align-items: flex-end; justify-content: center; }
.sheet { width: min(760px, 100%); max-height: calc(100% - var(--safe-t) - 24px); background: var(--panel-solid); border: 1px solid var(--line); border-bottom: 0; border-radius: var(--r-lg) var(--r-lg) 0 0; display: flex; flex-direction: column; animation: up .22s ease-out; box-shadow: 0 -10px 40px rgba(0,0,0,.4); }
.modal-mid { align-items: center; padding: 16px; }
.modal-mid .sheet { border-radius: var(--r-lg); border-bottom: 1px solid var(--line); max-height: calc(100% - var(--safe-t) - var(--safe-b) - 32px); width: min(560px, 100%); }
@keyframes up { from { transform: translateY(30px); opacity: .4; } }
.sheet-h { display: flex; align-items: center; gap: 10px; padding: 14px 16px 10px; border-bottom: 1px solid var(--line); }
.sheet-h h3 { margin: 0; font-family: var(--font-display); font-weight: 400; font-size: 19px; flex: 1; }
.sheet-b { padding: 12px 16px calc(var(--safe-b) + 16px); overflow-y: auto; display: flex; flex-direction: column; gap: 12px; }
.sheet-b > * { flex-shrink: 0; }
.sheet-b p, .sheet-b li { line-height: 1.7; }
.sheet-b h4 { margin: 6px 0 0; font-size: 14px; color: var(--brass); letter-spacing: .04em; }
.sheet-b ol, .sheet-b ul { margin: 0; padding-left: 1.3em; }
.menu-list { display: flex; flex-direction: column; gap: 8px; }
.menu-list .btn { justify-content: flex-start; }
.toggle { display: flex; align-items: center; gap: 10px; min-height: 44px; cursor: pointer; font-weight: 700; }
.toggle input { width: 20px; height: 20px; accent-color: var(--brass); }

/* declare */
.five-grid { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 8px; }
.five-col { display: flex; flex-direction: column; gap: 6px; align-items: stretch; }
.five-col .hd { display: flex; align-items: center; justify-content: center; gap: 4px; font-size: 13px; font-weight: 700; color: var(--ink-dim); }
.five-col .hd svg { width: 14px; height: 14px; flex: none; }
.five-col select { min-height: 52px; border-radius: 12px; font-family: var(--font-num); font-size: 20px; font-weight: 700; text-align: center; text-align-last: center; color: #fff8ea; border: 2px solid transparent; appearance: none; -webkit-appearance: none; padding: 0 4px; }
.five-col select:focus-visible { border-color: var(--brass); }
.five-col select option { background: var(--panel-solid); color: var(--ink); }
.arrow-line { display: flex; justify-content: space-between; font-family: var(--font-num); font-weight: 700; color: var(--ink-dim); font-size: 13px; padding: 0 4px; }

/* log & result */
.logl { display: flex; flex-direction: column; gap: 6px; }
.logl div { padding: 6px 10px; border-radius: 10px; background: var(--panel-raise); line-height: 1.5; font-size: 13px; }
.res-table { display: flex; flex-direction: column; gap: 8px; }
.res-row { display: flex; align-items: center; gap: 8px; padding: 8px 10px; border-radius: 12px; background: var(--panel-raise); flex-wrap: wrap; }
.res-row .nm { font-weight: 700; flex: 1 1 90px; min-width: 0; }
.res-row .tl { display: flex; gap: 4px; }
.res-row.win { box-shadow: inset 0 0 0 2px var(--brass); }
.badge { flex: none; font-size: 12px; font-weight: 900; padding: 3px 10px; border-radius: 999px; }
.badge.win { background: var(--brass); color: var(--brass-ink); }
.badge.out { background: rgba(242,102,90,.18); color: var(--stop); }
.win-title { font-family: var(--font-display); font-size: clamp(26px, 7vw, 36px); text-align: center; color: var(--brass); margin: 4px 0; text-wrap: balance; }

/* ---------- narrow phones ---------- */
@media (max-width: 420px) {
  .brand, #roomChip { display: none; }
  .memo-hint { display: none; }
  .mgrid { grid-template-columns: 30px repeat(12, minmax(0, 1fr)); gap: 2px; }
  .mcell { font-size: 12px; min-height: 29px; border-radius: 6px; }
  .mlab { font-size: 12px; }
}
@media (max-height: 700px) and (orientation: portrait) {
  .mcell, .mlab { min-height: 25px; }
  .mcell i { margin-top: 1px; }
  #actionbar { min-height: 46px; padding-block: 5px; }
  .btn { min-height: 38px; }
}

/* ---------- landscape & desktop: memo on the right ---------- */
@media (min-aspect-ratio: 5/4) {
  #app { grid-template-columns: minmax(0, 1fr) clamp(260px, 30vw, 400px); grid-template-rows: auto minmax(0, 1fr);

    function seg(id, opts, cur) { return '<div class="seg" id="' + id + '">' + opts.map(function (o) { return '<button data-v="' + o[0] + '" aria-pressed="' + (String(cur) === String(o[0])) + '">' + o[1] + '</button>'; }).join('') + '</div>'; }
    var h = sheetHead('設定') + '<div class="sheet-b">';
    h += '<div class="field"><span>テーブルの色</span>' + seg('sFelt', [['green', '緑'], ['navy', '紺'], ['wine', 'ワイン']], st.felt) + '</div>';
    h += '<div class="field"><span>画質</span>' + seg('sQual', [['high', 'きれい'], ['low', '軽い']], st.quality) + '</div>';
    h += '<div class="field"><span>効果音</span>' + seg('sSound', [['on', 'オン'], ['off', 'オフ']], st.sound ? 'on' : 'off') + '</div>';
    h += '<div class="field"><span>CPUの速さ</span>' + seg('sSpeed', [['0.6', 'ゆっくり'], ['1', 'ふつう'], ['1.7', 'はやい']], st.speed) + '</div>';
    h += '<label class="toggle"><input type="checkbox" id="sSeen"' + (st.autoSeen ? ' checked' : '') + '>見えている数字をメモで自動で消す</label>';
    h += '</div>';
    openLayer(h, 'modal-mid');
    ['sFelt', 'sQual', 'sSound', 'sSpeed'].forEach(function (id) {
      $(id).querySelectorAll('button').forEach(function (b) {
        b.addEventListener('click', function () {
          $(id).querySelectorAll('button').forEach(function (x) { x.setAttribute('aria-pressed', x === b ? 'true' : 'false'); });
          var v = b.dataset.v;
          if (id === 'sFelt') { st.felt = v; store('felt', v); App.scene.setFelt(v); }
          if (id === 'sQual') { st.quality = v; store('quality', v); App.scene.setQuality(v); }
          if (id === 'sSound') { st.sound = v === 'on'; store('sound', v); if (st.sound) sfx('ding'); }
          if (id === 'sSpeed') { st.speed = +v; store('speed', v); if (App.session && App.session.isHost) App.session.speed = +v; }
        });
      });
    });
    $('sSeen').addEventListener('change', function (e) { st.autoSeen = e.target.checked; store('autoSeen', st.autoSeen ? 'on' : 'off'); renderMemo(); });
  }
  function openLog() {
    var h = sheetHead('できごと') + '<div class="sheet-b"><div class="logl">' + (App.hist.slice().reverse().map(function (t) { return '<div>' + t + '</div>'; }).join('') || '<p class="note">まだ何も起きていません。</p>') + '</div></div>';
    openLayer(h, 'modal-mid');
  }
  function openMenu() {
    var code = App.view && App.view.code;
    var h = sheetHead('メニュー') + '<div class="sheet-b">' + (code ? '<p class="note">部屋コード <b style="font-family:var(--font-num);font-size:18px;color:var(--brass);letter-spacing:.1em">' + esc(code) + '</b></p>' : '') + '<div class="menu-list">'
      + '<button class="btn" id="mnRules">あそびかた</button>'
      + '<button class="btn" id="mnSet">設定（テーブルの色・画質・音）</button>'
      + '<button class="btn" id="mnCam">視点をもとにもどす</button>'
      + '<button class="btn danger" id="mnExit">ゲームをやめる</button></div></div>';
    openLayer(h, 'modal-mid');
    $('mnRules').addEventListener('click', openRules);
    $('mnSet').addEventListener('click', openSettings);
    $('mnCam').addEventListener('click', function () { closeLayer(); App.scene.resetCam(); });
    $('mnExit').addEventListener('click', confirmExit);
  }
  function confirmExit() {
    var online = App.mode === 'host' || App.mode === 'client';
    var h = sheetHead('ゲームをやめる') + '<div class="sheet-b"><p>' + (App.mode === 'host' ? '部屋を閉じてタイトルにもどります。ほかの人のゲームも終わります。' : online ? '部屋から出てタイトルにもどります。' : 'このゲームをやめてタイトルにもどります。') + '</p><div class="row"><button class="btn ghost" data-close>つづける</button><button class="btn danger" id="exGo">やめる</button></div></div>';
    openLayer(h, 'modal-mid');
    $('exGo').addEventListener('click', function () { closeLayer(); toTitle(); });
  }

  /* ---------- pointer handling on the table ---------- */
  function bindStage() {
    var el = $('stage'), pts = {}, start = null, moved = false, pinch = 0;
    el.addEventListener('pointerdown', function (e) {
      audio();
      try { el.setPointerCapture(e.pointerId); } catch (x) {}
      pts[e.pointerId] = { x: e.clientX, y: e.clientY };
      var ids = Object.keys(pts);
      if (ids.length === 1) { start = { x: e.clientX, y: e.clientY, t: performance.now() }; moved = false; }
      else if (ids.length === 2) { var a = pts[ids[0]], b = pts[ids[1]]; pinch = Math.hypot(a.x - b.x, a.y - b.y); moved = true; }
    });
    el.addEventListener('pointermove', function (e) {
      var p = pts[e.pointerId]; if (!p) return;
      var ids = Object.keys(pts);
      if (ids.length === 2) {
        p.x = e.clientX; p.y = e.clientY;
        var a = pts[ids[0]], b = pts[ids[1]], d = Math.hypot(a.x - b.x, a.y - b.y);
        if (pinch > 0) App.scene.zoom(d / pinch); pinch = d; return;
      }
      var dx = e.clientX - p.x, dy = e.clientY - p.y;
      if (!moved && start && Math.hypot(e.clientX - start.x, e.clientY - start.y) > 10) moved = true;
      if (moved && !App.scene.attract) App.scene.orbit(dx, dy);
      p.x = e.clientX; p.y = e.clientY;
    });
    function up(e) {
      var wasTap = !moved && start && performance.now() - start.t < 600 && Object.keys(pts).length === 1;
      delete pts[e.pointerId];
      if (!Object.keys(pts).length) pinch = 0;
      if (wasTap && App.view && App.view.state && App.mode !== 'title') onTap(App.scene.pick(e.clientX, e.clientY, App.ui.sel));
    }
    el.addEventListener('pointerup', up);
    el.addEventListener('pointercancel', function (e) { delete pts[e.pointerId]; moved = true; });
    el.addEventListener('wheel', function (e) { e.preventDefault(); App.scene.zoom(e.deltaY > 0 ? 0.92 : 1.08); }, { passive: false });
  }

  /* ---------- boot ---------- */
  function boot(hot) {
    App.scene = new G.SCENE.Scene($('stage'));
    App.scene.setFelt(App.set.felt);
    if (App.set.quality !== 'high') App.scene.setQuality(App.set.quality);
    App.scene.onFrame = placeTags;
    function reserve() {
      // portrait keeps room for two rows of buttons under the table, landscape for one
      App.scene.reserve = App.mode === 'title' ? { top: 10, bottom: 10 } : sideMemo() ? { top: 30, bottom: 58 } : { top: 30, bottom: 104 };
    }
    App.reserve = reserve; reserve();
    if (G.ResizeObserver) new ResizeObserver(function () { reserve(); App.scene.resize(); }).observe($('stage'));
    window.addEventListener('resize', function () { reserve(); App.scene.resize(); });
    bindStage(); bindMemo();
    $('logoTiles').innerHTML = [7, 18, 24, 41, 55].map(miniTile).join('');
    if (document.fonts && document.fonts.load) {
      Promise.all([document.fonts.load('700 120px "Fredoka"'), document.fonts.load('400 20px "Mochiy Pop One"')]).then(function () { App.scene.refreshFonts(); }).catch(function () {});
    }
    $('goSolo').addEventListener('click', function () { show('scrSolo'); $('soloName').value = App.me.nm || ''; var c = store('soloCount'), l = store('soloLevel'); if (c) $('segCount').querySelectorAll('button').forEach(function (b) { b.setAttribute('aria-pressed', b.dataset.v === c ? 'true' : 'false'); }); if (l) $('segLevel').querySelectorAll('button').forEach(function (b) { b.setAttribute('aria-pressed', b.dataset.v === l ? 'true' : 'false'); }); });
    $('goOnline').addEventListener('click', function () { show('scrOnline'); $('onName').value = App.me.nm || ''; $('onErr').hidden = true; setOnlineNote(); roomCap(); });
    $('goRules').addEventListener('click', openRules);
    document.querySelectorAll('[data-back]').forEach(function (b) { b.addEventListener('click', function () { show('scrTitle'); }); });
    segInit('segCount'); segInit('segLevel');
    $('soloStart').addEventListener('click', startSolo);
    $('onCreate').addEventListener('click', createRoom);
    $('onJoin').addEventListener('click', joinRoom);
    $('onCode').addEventListener('keydown', function (e) { if (e.key === 'Enter') joinRoom(); });
    $('lobAddCpu').addEventListener('click', function () { if (App.session && App.session.isHost) App.session.addCpu(2); });
    $('lobStart').addEventListener('click', function () { if (App.session && App.session.isHost) App.session.start(); });
    $('lobLeave').addEventListener('click', toTitle);
    $('btnLog').addEventListener('click', openLog);
    $('btnMenu').addEventListener('click', openMenu);
    $('fiveBtn').addEventListener('click', openFive);
    if (hot && hot.solo && hot.solo.state && hot.solo.state.ph !== 'over' && hot.solo.state.sp) {
      var hs = new NET.HostSession({ me: hot.solo.me || App.me, onView: onView });
      hs.speed = App.set.speed; hs.state = hot.solo.state; App.me = hs.me;
      App.session = hs; App.mode = 'solo';
      onView(hs.view()); hs.tick();
    } else toTitle();
    if (G.claude && G.claude.hot && G.claude.hot.snapshot) {
      try { G.claude.hot.snapshot(function () { return App.mode === 'solo' && App.session && App.session.state ? { solo: { state: App.session.state, me: App.me } } : {}; }); } catch (e) {}
    }
    if (App.inClaude) roomCap();
  }
  function start(data) { try { boot(data || {}); } catch (e) { console.error(e); var d = document.createElement('p'); d.className = 'note warn'; d.style.cssText = 'position:fixed;left:16px;right:16px;top:40%;text-align:center;z-index:99'; d.textContent = '3D表示を開始できませんでした。ブラウザを最新にするか、別の端末でお試しください。'; document.body.appendChild(d); } }
  if (G.claude && G.claude.hot && G.claude.hot.ready) G.claude.hot.ready(start);
  else start(G.claude && G.claude.hot && G.claude.hot.data || {});
})(window);

</script>
</body>
</html>
