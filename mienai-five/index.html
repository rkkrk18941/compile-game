<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">

<title>ミエナイ・ファイブ</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Mochiy+Pop+One&family=Zen+Maru+Gothic:wght@500;700;900&display=swap">
<style>
[hidden]{display:none!important}
/* Layout: full-bleed 3D card table; HUD chips dock to the edges like a mahjong app, sheets slide over the felt */
:root {
  --ink: #fbf5e6;
  --ink-dim: #b8c3b6;
  --ink-faint: #7f8d82;
  --panel: rgba(13, 22, 18, 0.86);
  --panel-solid: #121e19;
  --panel-raise: #1a2a23;
  --line: rgba(251, 245, 230, 0.14);
  --brass: #f2c14e;
  --brass-deep: #b98a2c;
  --brass-ink: #2a1e05;
  --go: #48c487;
  --stop: #f2665a;
  --t-g: #2c9a5a; --t-p: #ec7aad; --t-b: #3889dc; --t-r: #de4438; --t-o: #f29526;
  --font-display: "Mochiy Pop One", "Zen Maru Gothic", "Hiragino Maru Gothic ProN", system-ui, sans-serif;
  --font-ui: "Zen Maru Gothic", "Hiragino Maru Gothic ProN", "Hiragino Sans", "Noto Sans JP", system-ui, sans-serif;
  --font-num: "Fredoka", "Arial Rounded MT Bold", "Zen Maru Gothic", system-ui, sans-serif;
  --r-sm: 10px; --r-md: 14px; --r-lg: 20px;
  --safe-t: env(safe-area-inset-top, 0px);
  --safe-b: env(safe-area-inset-bottom, 0px);
  color-scheme: dark;
}
html, body { height: 100%; }
body { margin: 0; background: #0d1411; color: var(--ink); font-family: var(--font-ui); font-size: 14px; overflow: hidden; -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; touch-action: manipulation; }
button { font: inherit; color: inherit; }
button:focus-visible, input:focus-visible, select:focus-visible, [tabindex]:focus-visible { outline: 3px solid var(--brass); outline-offset: 2px; }
#stage { position: fixed; inset: 0; touch-action: none; }
#stage canvas { display: block; }
#tags { position: fixed; inset: 0; pointer-events: none; overflow: hidden; }

/* ---------- top bar ---------- */
#topbar { position: fixed; top: 0; left: 0; right: 0; padding: calc(var(--safe-t) + 8px) 12px 8px; display: flex; align-items: center; gap: 8px; pointer-events: none; z-index: 5; }
#topbar > * { pointer-events: auto; }
.brand { font-family: var(--font-display); font-size: 15px; letter-spacing: 0.02em; color: var(--brass); padding: 6px 10px; background: var(--panel); border: 1px solid var(--line); border-radius: 999px; white-space: nowrap; }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 7px 12px; border-radius: 999px; background: var(--panel); border: 1px solid var(--line); font-weight: 700; white-space: nowrap; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
.chip.mine { background: var(--brass); color: var(--brass-ink); border-color: transparent; }
.chip .dot { width: 8px; height: 8px; border-radius: 50%; background: currentColor; flex: none; }
#turnChip { flex: 0 1 auto; min-width: 0; }
#roomChip { font-family: var(--font-num); letter-spacing: 0.08em; }
.spacer { flex: 1; }
.iconbtn { width: 40px; height: 40px; flex: none; display: grid; place-items: center; border-radius: 12px; background: var(--panel); border: 1px solid var(--line); cursor: pointer; }
.iconbtn svg { width: 20px; height: 20px; stroke: var(--ink); fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.iconbtn:active, .pillbtn:active { transform: translateY(1px); }
.pillbtn { height: 40px; flex: none; display: inline-flex; align-items: center; gap: 6px; padding: 0 14px 0 11px; border-radius: 12px; background: var(--panel); border: 1px solid var(--line); cursor: pointer; font-weight: 700; }
.pillbtn svg { width: 18px; height: 18px; stroke: var(--brass); fill: none; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
.menu-list { display: flex; flex-direction: column; gap: 8px; }
.menu-list .btn { justify-content: flex-start; }
.iconbtn.lit { border-color: var(--brass); }
.iconbtn.lit svg { stroke: var(--brass); }

/* ---------- name tags & labels ---------- */
.tag { position: absolute; transform: translate(-50%, -100%); display: flex; align-items: center; gap: 6px; padding: 4px 10px 4px 4px; border-radius: 999px; background: var(--panel); border: 1px solid var(--line); white-space: nowrap; font-weight: 700; font-size: 13px; transition: opacity .2s; }
.tag .av { width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; font-size: 12px; font-family: var(--font-display); color: var(--brass-ink); background: var(--brass); }
.tag .st { font-size: 11px; font-weight: 700; color: var(--ink-dim); }
.tag.turn { border-color: var(--brass); box-shadow: 0 0 0 3px rgba(242,193,78,.25); }
.tag.out { opacity: .55; }
.tag.out .av { background: var(--ink-faint); }
.tag.off .st { color: var(--stop); }
.cnt { position: absolute; transform: translate(-50%, -100%); min-width: 18px; height: 18px; display: grid; place-items: center; font-family: var(--font-num); font-weight: 600; font-size: 11px; color: var(--ink); background: rgba(8,14,11,.72); padding: 0 4px; border-radius: 999px; box-sizing: border-box; }

/* ---------- action bar ---------- */
#actionbar { position: fixed; left: 0; right: 0; bottom: 0; padding: 8px 12px calc(var(--safe-b) + 10px); display: flex; flex-direction: column; align-items: center; gap: 8px; pointer-events: none; z-index: 5; }
#actionbar > * { pointer-events: auto; }
#prompt { max-width: min(560px, calc(100vw - 132px)); align-self: flex-start; display: flex; align-items: center; flex-wrap: wrap; gap: 4px 8px; padding: 8px 14px; border-radius: var(--r-md); background: var(--panel); border: 1px solid var(--line); font-weight: 700; line-height: 1.4; }
#prompt b { color: var(--brass); }
#prompt .step { display: inline-grid; place-items: center; width: 22px; height: 22px; margin-right: 6px; border-radius: 50%; background: var(--brass); color: var(--brass-ink); font-family: var(--font-num); font-size: 13px; vertical-align: -3px; }
#actions { align-self: flex-start; display: flex; flex-wrap: wrap; gap: 8px; max-width: calc(100vw - 132px); }
.btn { min-height: 44px; padding: 0 16px; border-radius: var(--r-md); border: 1px solid var(--line); background: var(--panel-raise); font-weight: 700; font-size: 15px; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 8px; }
.btn.primary { background: var(--brass); color: var(--brass-ink); border-color: transparent; }
.btn.ghost { background: transparent; }
.btn.danger { background: var(--stop); color: #2a0703; border-color: transparent; }
.btn:disabled { opacity: .45; cursor: default; }
.btn:not(:disabled):active { transform: translateY(1px); }
.btn.sm { min-height: 34px; padding: 0 12px; font-size: 13px; border-radius: 10px; }
.colorchip { min-height: 44px; min-width: 46px; padding: 0 8px; justify-content: center; border-radius: var(--r-md); border: 2px solid transparent; font-family: var(--font-num); font-weight: 600; font-size: 15px; color: #fff; display: inline-flex; align-items: center; gap: 6px; cursor: pointer; }
.colorchip svg { width: 16px; height: 16px; fill: rgba(255,248,234,.95); }
.colorchip[aria-pressed="true"] { border-color: var(--brass); box-shadow: 0 0 0 3px rgba(242,193,78,.35); }
.colorchip:disabled { opacity: .3; }

#fiveBtn { position: fixed; right: 14px; bottom: calc(var(--safe-b) + 14px); width: 96px; height: 96px; border-radius: 50%; border: 0; z-index: 6; cursor: pointer; background: radial-gradient(circle at 35% 30%, #ffe08a, var(--brass) 55%, var(--brass-deep)); color: var(--brass-ink); font-family: var(--font-display); font-size: 15px; line-height: 1.15; white-space: nowrap; box-shadow: 0 6px 0 #7d5a14, 0 12px 26px rgba(0,0,0,.45); display: grid; place-items: center; text-align: center; }
#fiveBtn small { display: block; font-family: var(--font-ui); font-weight: 900; font-size: 10px; letter-spacing: .04em; opacity: .8; }
#fiveBtn:active { transform: translateY(4px); box-shadow: 0 2px 0 #7d5a14, 0 6px 14px rgba(0,0,0,.45); }
#fiveBtn.pulse { animation: pulse 1.1s ease-in-out infinite; }
@keyframes pulse { 50% { transform: scale(1.07); } }

#tileInfo { position: fixed; left: 50%; top: calc(var(--safe-t) + 62px); transform: translateX(-50%); z-index: 6; width: max-content; box-sizing: border-box; display: flex; align-items: center; gap: 10px; padding: 8px 10px 8px 8px; border-radius: var(--r-md); background: var(--panel-solid); border: 1px solid var(--line); box-shadow: 0 8px 22px rgba(0,0,0,.4); max-width: calc(100vw - 32px); }
#tileInfo .mini { flex: none; }
#tileInfo .txt { min-width: 0; line-height: 1.35; }
#tileInfo .txt b { font-size: 16px; font-family: var(--font-num); }
#tileInfo .txt .meta { white-space: nowrap; font-weight: 700; margin-left: 6px; }
#tileInfo .txt span { color: var(--ink-dim); font-size: 12px; }
.mini { width: 34px; height: 40px; border-radius: 8px; display: grid; place-items: center; font-family: var(--font-num); font-weight: 700; font-size: 17px; color: #fff8ea; text-shadow: 0 1px 0 rgba(0,0,0,.35); position: relative; }
.mini i { position: absolute; bottom: 4px; left: 0; right: 0; display: flex; justify-content: center; gap: 2px; }
.mini i::before, .mini i::after { content: none; }
.mini i span { width: 4px; height: 4px; border-radius: 50%; background: #fff8ea; }
.mini svg { width: 18px; height: 18px; fill: rgba(255,248,234,.95); }

/* ---------- toasts & stamp ---------- */
body.info-open #toasts { top: calc(var(--safe-t) + 128px); }
#toasts { position: fixed; top: calc(var(--safe-t) + 60px); left: 50%; transform: translateX(-50%); display: flex; flex-direction: column; align-items: center; gap: 6px; z-index: 4; pointer-events: none; width: min(92vw, 520px); }
.toast { padding: 8px 14px; border-radius: 999px; background: var(--panel-solid); border: 1px solid var(--line); font-weight: 700; font-size: 13px; text-align: center; animation: tin .25s ease-out; max-width: 100%; }
.toast.me { border-color: var(--brass); }
.toast.bye { animation: tout .3s ease-in forwards; }
@keyframes tin { from { opacity: 0; transform: translateY(-8px); } }
@keyframes tout { to { opacity: 0; transform: translateY(-8px); } }
#stamp { position: fixed; left: 50%; top: 42%; transform: translate(-50%, -50%); z-index: 7; pointer-events: none; font-family: var(--font-display); font-size: clamp(30px, 9vw, 64px); padding: 10px 26px; border-radius: 22px; border: 5px solid currentColor; background: rgba(13,22,18,.82); opacity: 0; white-space: nowrap; }
#stamp.show { animation: stamp 1.7s ease-out forwards; }
#stamp.yes { color: var(--go); } #stamp.no { color: var(--stop); } #stamp.info { color: var(--brass); }
#stamp small { display: block; font-family: var(--font-ui); font-weight: 900; font-size: .32em; text-align: center; color: var(--ink); }
@keyframes stamp { 0% { opacity: 0; transform: translate(-50%, -50%) scale(1.6) rotate(-8deg); } 12% { opacity: 1; transform: translate(-50%, -50%) scale(1) rotate(-4deg); } 80% { opacity: 1; } 100% { opacity: 0; transform: translate(-50%, -50%) scale(.96) rotate(-4deg); } }

/* ---------- screens ---------- */
.screen { position: fixed; inset: 0; z-index: 10; display: flex; flex-direction: column; padding: calc(var(--safe-t) + 16px) 16px calc(var(--safe-b) + 16px); background: radial-gradient(ellipse at 50% 40%, rgba(13,20,17,.35), rgba(13,20,17,.8)); overflow-y: auto; }
.card { margin: auto; box-sizing: border-box; width: min(440px, 100%); background: var(--panel); border: 1px solid var(--line); border-radius: var(--r-lg); padding: 22px 20px; display: flex; flex-direction: column; gap: 14px; backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); box-shadow: 0 20px 50px rgba(0,0,0,.45); }
.logo { font-family: var(--font-display); font-size: clamp(34px, 10vw, 46px); line-height: 1.05; text-align: center; color: var(--ink); text-wrap: balance; }
.logo em { font-style: normal; color: var(--brass); }
.logo .tiles { display: flex; justify-content: center; gap: 6px; margin-bottom: 10px; }
.logo .tiles .mini { width: 30px; height: 36px; font-size: 15px; }
.tagline { text-align: center; color: var(--ink-dim); line-height: 1.6; margin: 0; text-wrap: balance; }
.card h2 { margin: 0; font-family: var(--font-display); font-size: 22px; font-weight: 400; }
.stack { display: flex; flex-direction: column; gap: 10px; }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.row > .btn { flex: 1 1 0; }
.field { display: flex; flex-direction: column; gap: 6px; }
.field > span { font-size: 12px; font-weight: 700; color: var(--ink-dim); letter-spacing: .04em; }
.input { min-height: 46px; padding: 0 14px; border-radius: var(--r-md); border: 1px solid var(--line); background: #0c1612; color: var(--ink); font: inherit; font-size: 16px; font-weight: 700; width: 100%; box-sizing: border-box; user-select: text; -webkit-user-select: text; }
.input.code { font-family: var(--font-num); font-size: 26px; letter-spacing: .3em; text-align: center; }
.seg { display: flex; padding: 4px; border-radius: var(--r-md); background: #0c1612; border: 1px solid var(--line); gap: 4px; }
.seg button { flex: 1; min-height: 40px; border: 0; border-radius: 10px; background: transparent; font-weight: 700; cursor: pointer; color: var(--ink-dim); }
.seg button[aria-pressed="true"] { background: var(--brass); color: var(--brass-ink); }
.note { font-size: 12px; color: var(--ink-dim); line-height: 1.6; margin: 0; }
.note.warn { color: var(--stop); }
.credit { font-size: 11px; color: var(--ink-faint); text-align: center; line-height: 1.6; margin: 0; }
.bigcode { font-family: var(--font-num); font-weight: 700; font-size: 48px; letter-spacing: .22em; text-align: center; color: var(--brass); padding: 6px 0 0 .22em; }
.seats { display: flex; flex-direction: column; gap: 6px; }
.seat { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: var(--r-md); background: var(--panel-raise); border: 1px solid var(--line); min-height: 44px; }
.seat .nm { flex: 1; min-width: 0; font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.seat .who { font-size: 11px; color: var(--ink-dim); font-weight: 700; }
.seat select { min-height: 34px; border-radius: 8px; background: #0c1612; color: var(--ink); border: 1px solid var(--line); font: inherit; font-weight: 700; }
.seat .x { width: 34px; height: 34px; border-radius: 8px; border: 1px solid var(--line); background: transparent; cursor: pointer; }

/* ---------- sheets & modals ---------- */
.scrim { position: fixed; inset: 0; z-index: 20; background: rgba(5,9,7,.55); display: flex; align-items: flex-end; justify-content: center; }
.sheet { width: min(760px, 100%); max-height: calc(100% - var(--safe-t) - 24px); background: var(--panel-solid); border: 1px solid var(--line); border-bottom: 0; border-radius: var(--r-lg) var(--r-lg) 0 0; display: flex; flex-direction: column; animation: up .22s ease-out; box-shadow: 0 -10px 40px rgba(0,0,0,.4); }
.modal-mid { align-items: center; padding: 16px; }
.modal-mid .sheet { border-radius: var(--r-lg); border-bottom: 1px solid var(--line); max-height: calc(100% - var(--safe-t) - var(--safe-b) - 32px); width: min(560px, 100%); }
@keyframes up { from { transform: translateY(30px); opacity: .4; } }
.sheet-h { display: flex; align-items: center; gap: 10px; padding: 14px 16px 10px; border-bottom: 1px solid var(--line); }
.sheet-h h3 { margin: 0; font-family: var(--font-display); font-weight: 400; font-size: 19px; flex: 1; }
.sheet-b { padding: 12px 16px calc(var(--safe-b) + 16px); overflow-y: auto; display: flex; flex-direction: column; gap: 12px; }
.sheet-b > * { flex-shrink: 0; }
.sheet-b p, .sheet-b li { line-height: 1.7; }
.sheet-b h4 { margin: 6px 0 0; font-size: 14px; color: var(--brass); letter-spacing: .04em; }
.sheet-b ol, .sheet-b ul { margin: 0; padding-left: 1.3em; }

/* memo board */
.boxes { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px; }
.box { min-height: 54px; border-radius: 12px; border: 2px dashed rgba(251,245,230,.35); background: #0c1612; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; cursor: pointer; position: relative; }
.box .bn { font-family: var(--font-num); font-weight: 700; font-size: 22px; }
.box .bl { font-size: 10px; font-weight: 700; color: var(--ink-dim); display: flex; align-items: center; gap: 3px; }
.box .bl svg { width: 11px; height: 11px; }
.box[aria-pressed="true"] { border-style: solid; border-color: var(--brass); box-shadow: 0 0 0 3px rgba(242,193,78,.25); }
.box .cands { position: absolute; top: 3px; right: 6px; font-size: 10px; color: var(--ink-dim); font-family: var(--font-num); }
.grid-wrap { overflow-x: auto; margin: 0 -4px; padding: 0 4px; }
.grid { display: grid; grid-template-columns: 26px repeat(12, minmax(34px, 1fr)); gap: 4px; min-width: 470px; }
.grid.tall { grid-template-columns: 30px repeat(5, minmax(0, 1fr)); min-width: 0; }
.grid .colhd { display: grid; place-items: center; height: 22px; }
.grid .colhd svg { width: 16px; height: 16px; }
.grid .rowlab.dots { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; }
.grid .rowlab.dots span { width: 5px; height: 5px; border-radius: 50%; background: var(--ink-dim); }
.grid .rowlab { display: grid; place-items: center; }
.grid .rowlab svg { width: 16px; height: 16px; }
.cell { position: relative; height: 44px; border-radius: 9px; border: 0; padding: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; font-family: var(--font-num); font-weight: 700; font-size: 16px; color: #fff8ea; cursor: pointer; text-shadow: 0 1px 0 rgba(0,0,0,.3); }
.cell i { display: flex; gap: 2px; margin-top: 1px; }
.cell i span { width: 4px; height: 4px; border-radius: 50%; background: #fff8ea; }
.cell.seen { opacity: .22; }
.cell.seen::after { content: ""; position: absolute; inset: 6px 4px; background: linear-gradient(to top right, transparent calc(50% - 1.5px), #fff8ea calc(50% - 1.5px), #fff8ea calc(50% + 1.5px), transparent calc(50% + 1.5px)); opacity: .9; }
.cell.x { opacity: .32; }
.cell.x::after { content: "×"; position: absolute; inset: 0; display: grid; place-items: center; font-size: 30px; font-family: var(--font-ui); font-weight: 900; color: #1b0f0b; text-shadow: none; opacity: .75; }
.cell.o { box-shadow: inset 0 0 0 3px #fff8ea; }
.cell.auto { opacity: .3; }
.cell.mine { outline: 3px solid var(--brass); outline-offset: 1px; }
.memo-tools { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.toggle { display: flex; align-items: center; gap: 10px; min-height: 44px; cursor: pointer; font-weight: 700; }
.toggle input { width: 20px; height: 20px; accent-color: var(--brass); }
.clues { display: flex; flex-direction: column; gap: 6px; }
.clue { display: flex; align-items: center; gap: 8px; padding: 6px 8px; border-radius: 10px; background: var(--panel-raise); font-weight: 700; font-size: 13px; }
.clue .res { margin-left: auto; font-size: 12px; padding: 2px 8px; border-radius: 999px; }
.clue .res.yes { background: rgba(72,196,135,.18); color: var(--go); }
.clue .res.no { background: rgba(242,102,90,.18); color: var(--stop); }
.clue .res.pos { background: rgba(242,193,78,.16); color: var(--brass); }

/* declare */
.five-grid { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 8px; }
.five-col { display: flex; flex-direction: column; gap: 6px; align-items: stretch; }
.five-col .hd { display: flex; align-items: center; justify-content: center; gap: 4px; font-size: 13px; font-weight: 700; color: var(--ink-dim); }
.five-col .hd svg { width: 14px; height: 14px; flex: none; }
.five-col select { min-height: 52px; border-radius: 12px; font-family: var(--font-num); font-size: 20px; font-weight: 700; text-align: center; text-align-last: center; color: #fff8ea; border: 2px solid transparent; appearance: none; -webkit-appearance: none; padding: 0 4px; }
.five-col select:focus-visible { border-color: var(--brass); }
.five-col select option { background: var(--panel-solid); color: var(--ink); }
.arrow-line { display: flex; justify-content: space-between; font-family: var(--font-num); font-weight: 700; color: var(--ink-dim); font-size: 13px; padding: 0 4px; }

/* log & result */
.logl { display: flex; flex-direction: column; gap: 6px; }
.logl div { padding: 6px 10px; border-radius: 10px; background: var(--panel-raise); line-height: 1.5; font-size: 13px; }
.res-table { display: flex; flex-direction: column; gap: 8px; }
.res-row { display: flex; align-items: center; gap: 8px; padding: 8px 10px; border-radius: 12px; background: var(--panel-raise); flex-wrap: wrap; }
.res-row .nm { font-weight: 700; flex: 1 1 90px; min-width: 0; }
.res-row .tl { display: flex; gap: 4px; }
.res-row.win { box-shadow: inset 0 0 0 2px var(--brass); }
.badge { flex: none; font-size: 12px; font-weight: 900; padding: 3px 10px; border-radius: 999px; }
.badge.win { background: var(--brass); color: var(--brass-ink); }
.badge.out { background: rgba(242,102,90,.18); color: var(--stop); }
.win-title { font-family: var(--font-display); font-size: clamp(26px, 7vw, 36px); text-align: center; color: var(--brass); margin: 4px 0; text-wrap: balance; }

@media (max-width: 560px) {
  .brand, #roomChip { display: none; }
  #fiveBtn { width: 84px; height: 84px; font-size: 13px; }
  #prompt, #actions { max-width: calc(100vw - 118px); }
}
@media (orientation: portrait) {

<script>

  }

    COLORS: COLORS, COLOR_JA: COLOR_JA, colorIdx: colorIdx, colorOf: colorOf, dotsOf: dotsOf,

/* ===== AI: deduction from one player's point of view + CPU decisions ===== */

  /* ---------- attract mode for the title ---------- */

  function startSolo() {

  function onlineErr(e) {

      }
      if (!code) throw { code: 'taken' };
      var hs = new NET.HostSession({ me: App.me, transport: tr, code: code, onView: onView, onEvent: hostEvent });
      hs.speed = App.set.speed;

  }
  async function joinRoom() {

    var nm = NET.cleanName($('onName').value || 'ゲスト'); App.me.nm = nm; store('name', nm);

  /* ---------- log -> toasts ---------- */
  function pname(s, i, me) { return i === me ? 'あなた' : (s.P[i] ? s.P[i].nm : '?'); }
  function logText(s, e, me) {
    var k = e[1], N = function (i) { return esc(pname(s, i, me)); };
    switch (k) {
      case 'st': return N(e[2]) + 'から始めます';
      case 'rv': return N(e[2]) + 'が <b>' + e[3] + '</b>（' + CJA[E.colorIdx(e[3])] + '）をめくった';
      case 'so': return N(e[2]) + 'が <b>' + e[3] + '</b> を仕分け → ' + posText(e[4]);
      case 'cp': return N(e[2]) + 'の' + CIRC[e[4]] + '（' + CJA[s.P[e[2]].sc[e[4]]] + '）と <b>' + e[3] + '</b> → ドット' + (e[5] ? '同じ' : 'ちがう');
      case 'fv': return N(e[2]) + 'の「ファイブ！」→ ' + (e[3] ? '正解！' : 'はずれ… 脱落');
      case 'lw': return N(e[2]) + 'が最後のひとりで勝ち';
      case 'sk': return '山がなくなったので、めくらずに手がかりへ';
      case 'fn': return '手がかりが尽きました。順番に宣言します';
      case 'dr': return '全員はずれで引き分け';
    }
    return '';
  }
  function processLog(s, me) {
    var fresh = !App.seen[s.gid];
    if (fresh) { App.seen = {}; App.seen[s.gid] = 1; App.hist = []; }
    s.lg.forEach(function (e) {
      var key = s.gid + ':' + e.join(',');
      if (App.seen[key]) return;
      App.seen[key] = 1;
      var txt = logText(s, e, me);
      App.hist.push(txt);
      if (fresh && e[1] !== 'st') return;
      var mine = e[2] === me;
      switch (e[1]) {
        case 'st': toast(txt); sfx('ding'); break;
        case 'rv': toast(txt, mine); sfx('flip'); break;
        case 'so': toast(txt, mine); sfx('clack'); if (mine) stamp(posText(e[4]), 'info', e[3] + ' の位置'); break;
        case 'cp': toast(txt, mine); sfx('clack'); if (mine) { stamp(e[5] ? '同じ！' : 'ちがう', e[5] ? 'yes' : 'no', e[3] + ' と ' + CIRC[e[4]] + ' のドット'); sfx(e[5] ? 'yes' : 'no'); } break;
        case 'fv': toast(txt, mine); stamp('ファイブ！', e[3] ? 'yes' : 'no', pname(s, e[2], me) + (e[3] ? '：正解' : '：はずれ')); sfx(e[3] ? 'win' : 'lose'); break;
        default: toast(txt);

  }

  /* ---------- turn flow ---------- */
  function myTurn(s, me) { return me >= 0 && s.ph !== 'over' && s.tu === me && !s.P[me].out; }
  function syncSelection(s, me) {
    var ui = App.ui, step = null;
    if (myTurn(s, me)) step = s.ph === 'reveal' ? 'reveal' : s.ph === 'clue' ? (ui.kind === 'cmp' ? 'pickMine' : 'pickTile') : 'final';
    if (step !== ui.step) {
      if (!(ui.step === 'pickMine' && step === 'pickMine')) ui.sel = null;
      if (step !== 'pickMine' && step !== 'pickTile') ui.kind = null;
      ui.step = step;
    }
    if (ui.sel && ui.sel.kind === 'tile' && s.pool.indexOf(ui.sel.n) < 0) ui.sel = null;
    if (ui.poolSel && s.pool.indexOf(ui.poolSel) < 0) { ui.poolSel = null; ui.kind = null; if (ui.step === 'pickMine') ui.step = 'pickTile'; }
    applyHighlight();
  }
  function applyHighlight() {
    var v = App.view, s = v && v.state; if (!s) return;
    var ui = App.ui, hl = {}, sel = null, counts = E.supplyCounts(s);
    if (ui.step === 'reveal') { hl.stacks = [0, 1, 2, 3, 4].filter(function (c) { return counts[c] > 0; }); if (ui.sel && ui.sel.kind === 'stack') sel = ui.sel; }
    else if (ui.step === 'pickTile') { hl.tiles = s.pool.slice(); if (ui.poolSel) sel = { kind: 'tile', n: ui.poolSel }; }
    else if (ui.step === 'pickMine') { hl.mine = [0, 1, 2, 3, 4]; hl.tiles = ui.poolSel ? [ui.poolSel] : []; if (ui.sel && ui.sel.kind === 'mine') sel = ui.sel; }
    if (!sel && ui.peek) sel = ui.peek;
    App.scene.setHighlight(hl, sel);
  }
  function busy() { return App.session && App.session.busy && App.session.busy(); }
  function doAct(a) {
    if (!App.session) return;
    var r = App.session.act(a);
    if (r && r.ok === false && r.err === 'busy') toast('送信中です。少し待ってください');
    App.ui.sel = null; App.ui.poolSel = null; App.ui.kind = null; App.ui.peek = null;
    hideInfo();
    renderHud();
  }
  function reveal(c) { sfx('clack'); doAct({ t: 'reveal', c: c }); }
  function clueSort() { if (App.ui.poolSel) doAct({ t: 'sort', tile: App.ui.poolSel }); }
  function clueCmp(j) { if (App.ui.poolSel != null) doAct({ t: 'cmp', tile: App.ui.poolSel, j: j }); }

  function onTap(info) {
    var v = App.view, s = v && v.state; if (!s) return;
    var me = mySeat(), ui = App.ui;
    if (!info) { ui.peek = null; hideInfo(); applyHighlight(); return; }
    if (info.kind === 'stack') {
      var cnt = E.supplyCounts(s)[info.c];
      if (ui.step === 'reveal' && cnt > 0) {
        if (ui.sel && ui.sel.kind === 'stack' && ui.sel.c === info.c) { reveal(info.c); return; }
        ui.sel = { kind: 'stack', c: info.c }; sfx('clack');
      }
      showInfo(miniBack(info.c), '<b>' + CJA[info.c] + 'の山</b><br><span>のこり ' + cnt + ' 枚' + (ui.step === 'reveal' ? '　もう一度タップでめくる' : '') + '</span>');
    } else if (info.kind === 'mine') {
      if (info.p !== me) return;
      if (ui.step === 'pickMine') {
        if (ui.sel && ui.sel.kind === 'mine' && ui.sel.j === info.j) { clueCmp(info.j); return; }
        ui.sel = { kind: 'mine', j: info.j }; sfx('clack');
      } else ui.peek = { kind: 'mine', j: info.j };
      var box = App.memo && App.memo.boxes[info.j];
      var extra = '数字はあなたにだけ見えません';
      if (box) extra = 'メモ：' + box;
      if (App.memo && App.memo.assist) { var c = candidates(); if (c) extra += '　候補 ' + c.slots[info.j].length + ' 個'; }
      showInfo(miniBack(info.c), '<b>あなたの' + CIRC[info.j] + '（' + CJA[info.c] + '）</b><br><span>' + extra + (ui.step === 'pickMine' ? '　もう一度タップで比較' : '') + '</span>');
    } else if (info.kind === 'tile') {
      var n = info.n, role = info.role || {};

        if (ui.poolSel === n && ui.step === 'pickTile') { ui.poolSel = null; }
        else { ui.poolSel = n; if (ui.step === 'pickMine') { ui.sel = null; } }
        sfx('clack');
      } else ui.peek = { kind: 'tile', n: n };
      var where = '';
      if (role.kind === 'pool') where = '場に公開中';
      else if (role.kind === 'rack') where = esc(pname(s, role.p, me)) + 'のスタンド ' + CIRC[role.j];
      else if (role.kind === 'sort') where = esc(pname(s, role.p, me)) + 'の仕分け：' + posText(role.k);
      else if (role.kind === 'cmp') where = esc(pname(s, role.p, me)) + 'の' + CIRC[role.j] + 'とドット' + (role.y ? '同じ' : 'ちがう');
      showInfo(miniTile(n), '<b>' + n + '</b><span class="meta">' + CJA[E.colorIdx(n)] + '・ドット' + E.dotsOf(n) + '</span><br><span>' + where + '</span>');
    }
    applyHighlight(); renderHud();
  }
  var infoTimer = null;
  function showInfo(icon, html) {
    var t = $('tileInfo'); t.innerHTML = icon + '<div class="txt">' + html + '</div>'; t.hidden = false; document.body.classList.add('info-open');
    clearTimeout(infoTimer); infoTimer = setTimeout(hideInfo, 5000);

  function hideInfo() { $('tileInfo').hidden = true; document.body.classList.remove('info-open'); if (App.ui.peek) { App.ui.peek = null; applyHighlight(); } }

  /* ---------- HUD ---------- */
  function renderHud() {
    var v = App.view, s = v && v.state; if (!s) return;
    var me = mySeat(), ui = App.ui, mine = myTurn(s, me), P = s.P[s.tu];

    var chip = $('turnChip');

    var rc = $('roomChip'); rc.hidden = !v.code; rc.textContent = v.code ? '部屋 ' + v.code : '';
    var pr = $('prompt'), ac = $('actions'), html = '', btns = [];
    var counts = E.supplyCounts(s);
    var out = me >= 0 && s.P[me].out;

    } else if (me < 0) {

    } else if (busy()) {

      for (var c = 0; c < 5; c++) btns.push('<button class="colorchip" data-col="' + c + '" style="background:' + TCSS[c] + '" aria-pressed="' + (selC === c ? 'true' : 'false') + '" aria-label="' + CJA[c] + '（のこり' + counts[c] + '枚）"' + (counts[c] ? '' : ' disabled') + '>' + glyphSVG(c) + counts[c] + '</button>');
    } else if (ui.step === 'pickTile') {

      }

      html = selJ < 0 ? '<span><span class="step">3</span><b>' + ui.poolSel + '</b> と比べる自分のタイル</span>'
        : '<span><span class="step">3</span><b>' + ui.poolSel + '</b> と' + CIRC[selJ] + 'を比較？</span><button class="btn primary sm" id="aCmpGo">比較する</button>';
      for (var j = 0; j < 5; j++) btns.push('<button class="colorchip" data-mine="' + j + '" style="background:' + TCSS[s.P[me].sc[j]] + '" aria-pressed="' + (selJ === j ? 'true' : 'false') + '" aria-label="' + CIRC[j] + 'と比較">' + CIRC[j] + '</button>');
      btns.push('<button class="btn ghost" id="aBack">もどる</button>');
    } else if (ui.step === 'final') {

    } else {

      html = '<span>' + who + 'の番 — ' + (s.ph === 'reveal' ? 'めくる色を考え中…' : s.ph === 'clue' ? '手がかりを考え中…' : '宣言中…') + (P && P.here === false && !P.cpu ? '（切断中）' : '') + '</span>';

    }
    pr.innerHTML = html.indexOf('<span') === 0 ? html : '<span>' + html + '</span>';

  /* ---------- pointer handling on the table ---------- */
  function bindStage() {
    var el = $('stage'), pts = {}, start = null, moved = false, pinch = 0;
    el.addEventListener('pointerdown', function (e) {
      audio();
      el.setPointerCapture(e.pointerId);
      pts[e.pointerId] = { x: e.clientX, y: e.clientY };
      var ids = Object.keys(pts);
      if (ids.length === 1) { start = { x: e.clientX, y: e.clientY, t: performance.now() }; moved = false; }
      else if (ids.length === 2) { var a = pts[ids[0]], b = pts[ids[1]]; pinch = Math.hypot(a.x - b.x, a.y - b.y); moved = true; }
    });
    el.addEventListener('pointermove', function (e) {
      var p = pts[e.pointerId]; if (!p) return;
      var ids = Object.keys(pts);
      if (ids.length === 2) {
        p.x = e.clientX; p.y = e.clientY;
        var a = pts[ids[0]], b = pts[ids[1]], d = Math.hypot(a.x - b.x, a.y - b.y);
        if (pinch > 0) App.scene.zoom(d / pinch); pinch = d; return;
      }
      var dx = e.clientX - p.x, dy = e.clientY - p.y;
      if (!moved && start && Math.hypot(e.clientX - start.x, e.clientY - start.y) > 9) moved = true;
      if (moved && !App.scene.attract) App.scene.orbit(dx, dy);
      p.x = e.clientX; p.y = e.clientY;
    });
    function up(e) {
      var wasTap = !moved && start && performance.now() - start.t < 600 && Object.keys(pts).length === 1;
      delete pts[e.pointerId];
      if (!Object.keys(pts).length) pinch = 0;
      if (wasTap && App.view && App.view.state && App.mode !== 'title') onTap(App.scene.pick(e.clientX, e.clientY));
    }
    el.addEventListener('pointerup', up);
    el.addEventListener('pointercancel', function (e) { delete pts[e.pointerId]; moved = true; });
    el.addEventListener('wheel', function (e) { e.preventDefault(); App.scene.zoom(e.deltaY > 0 ? 0.92 : 1.08); }, { passive: false });
  }

  /* ---------- boot ---------- */
  function boot(hot) {
    App.scene = new G.SCENE.Scene($('stage'));
    App.scene.setFelt(App.set.felt);
    if (App.set.quality !== 'high') App.scene.setQuality(App.set.quality);
    App.scene.onFrame = placeTags;
    window.addEventListener('resize', function () { App.scene.resize(); });
    bindStage();
    // logo tiles
    $('logoTiles').innerHTML = [7, 18, 24, 41, 55].map(miniTile).join('');
    // fonts -> redraw tile numbers
    if (document.fonts && document.fonts.load) {
      Promise.all([document.fonts.load('700 120px "Fredoka"'), document.fonts.load('400 20px "Mochiy Pop One"')]).then(function () { App.scene.refreshFonts(); }).catch(function () {});
    }
    // buttons
    $('goSolo').addEventListener('click', function () { show('scrSolo'); $('soloName').value = App.me.nm || ''; var c = store('soloCount'), l = store('soloLevel'); if (c) $('segCount').querySelectorAll('button').forEach(function (b) { b.setAttribute('aria-pressed', b.dataset.v === c ? 'true' : 'false'); }); if (l) $('segLevel').querySelectorAll('button').forEach(function (b) { b.setAttribute('aria-pressed', b.dataset.v === l ? 'true' : 'false'); }); });
    $('goOnline').addEventListener('click', function () { show('scrOnline'); $('onName').value = App.me.nm || ''; $('onErr').hidden = true; setOnlineNote(); roomCap(); });
    $('goRules').addEventListener('click', openRules);
    document.querySelectorAll('[data-back]').forEach(function (b) { b.addEventListener('click', function () { show('scrTitle'); }); });
    segInit('segCount'); segInit('segLevel');
    $('soloStart').addEventListener('click', startSolo);
    $('onCreate').addEventListener('click', createRoom);
    $('onJoin').addEventListener('click', joinRoom);
    $('onCode').addEventListener('keydown', function (e) { if (e.key === 'Enter') joinRoom(); });
    $('lobAddCpu').addEventListener('click', function () { if (App.session && App.session.isHost) App.session.addCpu(2); });
    $('lobStart').addEventListener('click', function () { if (App.session && App.session.isHost) App.session.start(); });
    $('lobLeave').addEventListener('click', toTitle);
    $('btnMemo').addEventListener('click', openMemo);
    $('btnLog').addEventListener('click', openLog);
    $('btnMenu').addEventListener('click', openMenu);
    $('fiveBtn').addEventListener('click', openFive);
    // resume a CPU game after a live update of the page
    if (hot && hot.solo && hot.solo.state && hot.solo.state.ph !== 'over') {
      var hs = new NET.HostSession({ me: hot.solo.me || App.me, onView: onView });
      hs.speed = App.set.speed; hs.state = hot.solo.state; App.me = hs.me;
      App.session = hs; App.mode = 'solo';
      onView(hs.view()); hs.tick();
    } else toTitle();
    if (G.claude && G.claude.hot && G.claude.hot.snapshot) {
      try { G.claude.hot.snapshot(function () { return App.mode === 'solo' && App.session && App.session.state ? { solo: { state: App.session.state, me: App.me } } : {}; }); } catch (e) {}
    }
    if (App.inClaude) roomCap();
  }
  function start(data) { try { boot(data || {}); } catch (e) { console.error(e); var d = document.createElement('p'); d.className = 'note warn'; d.style.cssText = 'position:fixed;left:16px;right:16px;top:40%;text-align:center;z-index:99'; d.textContent = '3D表示を開始できませんでした。ブラウザを最新にするか、別の端末でお試しください。'; document.body.appendChild(d); } }
  if (G.claude && G.claude.hot && G.claude.hot.ready) G.claude.hot.ready(start);
  else start(G.claude && G.claude.hot && G.claude.hot.data || {});
})(window);

</script>
