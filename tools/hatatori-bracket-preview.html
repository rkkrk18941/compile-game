<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ハタトリ・ナイン 大会表プレビュー</title><link rel="stylesheet" href="../hatatori-nine/tournament.css?v=20261019-parallel-1"><style>:root{--ink:#e9eff4;--ink-dim:#92a4b6;--brass:#e9c45a;--font-ui:system-ui,sans-serif;--font-num:system-ui,sans-serif;--font-display:system-ui,sans-serif;--line:#ffffff22}*{box-sizing:border-box}body{margin:0;background:#080f18;color:var(--ink);font:14px var(--font-ui);padding:24px}main{max-width:1180px;margin:auto}header{display:flex;align-items:center;gap:12px;margin-bottom:22px}h1{font-size:22px;margin:0;flex:1}button{cursor:pointer}.btn{background:#22313c;border:1px solid #ffffff22;border-radius:8px;color:#e7edf3;padding:8px 14px;font-weight:700}.primary{background:#a98b45;color:#fff}.note{font-size:12px;color:var(--ink-dim)}#logos{display:none}#logos.open{display:block}#board.hidden{display:none}#logos .logo-grid{grid-template-columns:repeat(5,1fr);max-width:800px;margin:0 auto}.logo-choice{padding:18px}.logo-choice .player-logo{width:104px;max-width:100%}.logo-choice span{font-size:13px}.live-matches{grid-template-columns:repeat(2,minmax(0,1fr))}@media(max-width:500px){body{padding:12px}header{flex-wrap:wrap}h1{width:100%;flex:auto}.live-matches{grid-template-columns:1fr}.logo-choice{padding:10px 3px}.logo-choice span{font-size:10px}}
</style><main><header><h1>ハタトリ・ナイン / 大会表</h1><button class="btn" id="showBoard">トーナメント表</button><button class="btn" id="showLogos">20種のロゴ</button><button class="btn" id="advance">勝ち上がりを見る</button><button class="btn" id="more">24人の表</button></header><div id="board"></div><div id="logos"><div class="logo-grid"></div></div><p id="status" aria-live="polite"></p></main><script src="../hatatori-nine/engine.js"></script><script src="../hatatori-nine/director.js?v=20261019-parallel-1"></script><script type="module">
import{tourBoardHTML}from'../hatatori-nine/tournament-board.js?v=20261019-parallel-1';import{PLAYER_LOGOS,logoHTML}from'../hatatori-nine/player-logos.js?v=20261019-parallel-1';let d,mid;function reset(n=6){d=new HTN_DIR.Director(Array.from({length:n},(_,i)=>({eid:i,name:['あなた','アトラス','レオン','ミラ','オリオン','ルクス'][i]||'選手'+(i+1),cpu:i?2:0,owner:i?null:'local',logo:PLAYER_LOGOS[i%20].id})),'cup',41,{});while(d.next())d.start();mid=d.matches.find(m=>m.state).id;render()}function render(){document.querySelector('#board').innerHTML=tourBoardHTML(d.summary(),{cid:'local',mid});document.querySelectorAll('[data-watch]').forEach(b=>b.onclick=()=>{mid=+b.dataset.watch;document.querySelector('#status').textContent='試合 '+(mid+1)+' を選択しました（表示確認用）';render()})}document.querySelector('#logos .logo-grid').innerHTML=PLAYER_LOGOS.map(l=>'<button class="logo-choice" aria-label="'+l.name+'">'+logoHTML(l.id)+'<span>'+l.name+'</span></button>').join('');document.querySelector('#showLogos').onclick=()=>{document.querySelector('#logos').classList.add('open');document.querySelector('#board').classList.add('hidden')};document.querySelector('#showBoard').onclick=()=>{document.querySelector('#logos').classList.remove('open');document.querySelector('#board').classList.remove('hidden')};document.querySelector('#advance').onclick=()=>{const m=d.matches.find(m=>m.state);if(m){const s=m.state;s.phase='over';s.winner=0;s.win='breakthrough';[0,1,2].forEach(f=>s.flags[f].claimed=0);d.finish(m,s);while(d.next())d.start();render()}};document.querySelector('#more').onclick=()=>reset(24);reset();
</script></html>
