<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ハタトリ・ナイン — カードと演出</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Oswald:wght@700&family=Dela+Gothic+One&family=Mochiy+Pop+One&family=Zen+Maru+Gothic:wght@700;900&display=swap" rel="stylesheet">
<style>body{margin:0;background:#101a16;color:#eee8d7;font:14px 'Zen Maru Gothic',sans-serif}main{max-width:1000px;margin:auto;padding:24px}h1{font-size:22px}button,select{font:inherit;background:#243a30;border:1px solid #5c735c;border-radius:8px;color:inherit;padding:10px 15px;cursor:pointer}button[aria-pressed=true]{background:#d6b76a;color:#171b15}.controls{display:flex;flex-wrap:wrap;gap:8px;align-items:center}#cards{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin:24px 0}#cards canvas{width:100%;height:auto;border-radius:14px;filter:drop-shadow(0 10px 12px #0007)}#stage{position:relative;width:100%;height:480px;overflow:hidden;border:1px solid #5c735c;border-radius:14px;background:#21382b}.fxcanvas{position:absolute;inset:0;opacity:0;pointer-events:none}.fxcanvas.on{opacity:1;pointer-events:auto}#all{display:grid;grid-template-columns:repeat(10,1fr);gap:8px;margin-top:24px}#all canvas{width:100%;height:auto}.note{color:#b9c7b5} @media(max-width:500px){main{padding:14px}#cards{gap:8px}#stage{height:400px}#all{grid-template-columns:repeat(5,1fr)}}
</style><main><h1>ハタトリ・ナイン｜カードと演出</h1><p class="note">絵柄と演出は、それぞれ別に選べます。</p><div class="controls" id="skins"><button data-s="classic">既存</button><button data-s="gilded">A・黒と金</button><button data-s="graphic">B・グラフィック</button></div><div id="cards"></div><div class="controls"><label>演出 <select id="effect"><option value="classic">既存の戦場</option><option value="gilded">金の光・紋章</option><option value="graphic">グラフィック</option></select></label><label>陣形 <select id="rank"><option value="4">楔形</option><option value="3">密集</option><option value="2">大隊</option><option value="1">散兵</option><option value="0">寄せ集め</option></select></label><button id="play">演出を見る</button><button id="freeze">確認用に停止表示</button></div><p class="note" id="status">準備しています</p><div id="stage"></div><div id="all"></div></main>
<script src="../hatatori-nine/engine.js"></script><script src="../hatatori-nine/art.js"></script>
<script type="module">
import{loadCardStyle,setCardStyle,paintStyledBack}from'../hatatori-nine/card-skins.js';import{paintCard}from'../hatatori-nine/scene.js?v=20261019-cardstyles-1';import{createFx}from'../hatatori-nine/fx.js?v=20261019-cardstyles-1';
const $=s=>document.querySelector(s);const fx=createFx($('#stage'));let current='classic';
function canvas(c){const cv=document.createElement('canvas');cv.width=408;cv.height=572;paintCard(cv.getContext('2d'),c,0,0,408,572);return cv;}
async function choose(style){fx.clear();await loadCardStyle(style);setCardStyle(style);current=style;$('#cards').replaceChildren(...[41,7,39,60].map(canvas));$('#all').replaceChildren(...Array.from({length:70},(_,i)=>canvas(i)));document.querySelectorAll('[data-s]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.s===style)));$('#status').textContent='表示中：'+({classic:'既存',gilded:'A・黒と金',graphic:'B・グラフィック'}[style]);}
$('#skins').onclick=e=>{if(e.target.dataset.s)choose(e.target.dataset.s);};
function play(freeze){fx.clear();fx.formation({effectStyle:$('#effect').value,mine:true,mineName:'あなた',rank:+$('#rank').value,fog:false,sum:27,cards:[7,8,9],wilds:{},colors:['#e2483d','#e2483d','#e2483d'],mode:'full',speed:1,seed:81,freezeAt:freeze?.52:undefined});}
$('#play').onclick=()=>play(false);$('#freeze').onclick=()=>play(true);window.addEventListener('resize',()=>fx.resize());await document.fonts.ready;await choose('classic');
</script></html>
